<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Powerhouse CMS — Content Manager</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,600..700,0..100;1,9..144,500..600,0..100&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="assets/img/logo-fill.svg" />

  <style>
    :root {
      /* Cool neutral gray palette */
      --bg:         #f6f7f9;
      --surface:    #ffffff;
      --surface-2:  #f2f4f7;
      --surface-3:  #f9fafb;
      --text:       #111827;
      --text-soft:  #374151;
      --text-mute:  #6b7280;
      --line:       #e5e7eb;
      --line-2:     #d1d5db;
      --line-3:     #9ca3af;
      --red:        #b91c1c;
      --red-warm:   #dc2626;
      --red-soft:   #fef2f2;
      --green:      #16a34a;
      --green-soft: #f0fdf4;
      --amber:      #d97706;
      --amber-soft: #fffbeb;
      --blue:       #2563eb;
      --blue-soft:  #eff6ff;

      --font-body: 'Switzer', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Fraunces', ui-serif, Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --sidebar-w: 288px;
      --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04), 0 1px 1px rgba(17, 24, 39, 0.02);
      --shadow-md: 0 4px 12px rgba(17, 24, 39, 0.06), 0 1px 2px rgba(17, 24, 39, 0.04);
      --shadow-lg: 0 12px 32px rgba(17, 24, 39, 0.10), 0 2px 6px rgba(17, 24, 39, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: rgba(220, 38, 38, 0.18); }

    .cms {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: 60px minmax(0, 1fr);
      grid-template-areas: "sidebar topbar" "sidebar main";
      height: 100vh;
    }

    /* ═══ TOP BAR ═══ */
    .cms-topbar {
      grid-area: topbar;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px 0 32px;
      z-index: 10;
    }
    .cms-topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cms-topbar-eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-mute);
      white-space: nowrap;
    }
    .cms-topbar-title {
      font-family: var(--font-display);
      font-size: 17px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.008em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cms-topbar-right { display: flex; align-items: center; gap: 8px; }

    .cms-saved {
      font-family: var(--font-mono);
      font-size: 11px; letter-spacing: 0.3px;
      color: var(--text-mute);
      display: inline-flex; align-items: center; gap: 8px;
      margin-right: 6px;
    }
    .cms-saved::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .cms-saved.is-dirty { color: var(--amber); }
    .cms-saved.is-dirty::before { background: var(--amber); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .cms-icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      position: relative;
    }
    .cms-icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-2); }
    .cms-icon-btn svg { width: 15px; height: 15px; }
    .cms-icon-btn kbd {
      position: absolute; top: -6px; right: -6px;
      font-family: var(--font-mono); font-size: 8.5px;
      background: var(--text); color: #fff;
      border-radius: 3px; padding: 1px 4px;
      opacity: 0;
      transition: opacity .15s;
    }
    .cms-icon-btn:hover kbd { opacity: 1; }

    .cms-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .cms-btn:hover { background: var(--surface-2); border-color: var(--line-2); }
    .cms-btn svg { width: 14px; height: 14px; }
    .cms-btn--primary {
      background: linear-gradient(180deg, var(--red-warm) 0%, var(--red) 100%);
      border-color: var(--red);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .cms-btn--primary:hover { background: var(--red-warm); }
    .cms-btn kbd {
      font-family: var(--font-mono); font-size: 10px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px; padding: 1px 4px;
      margin-left: 4px;
    }
    .cms-topbar-divider { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

    /* ═══ SIDEBAR ═══ */
    .cms-sidebar {
      grid-area: sidebar;
      background: var(--surface-3);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cms-brand {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .cms-brand img { width: 32px; height: 32px; }
    .cms-brand-text { line-height: 1.2; }
    .cms-brand-text .n {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 600;
      color: var(--text);
      display: block;
    }
    .cms-brand-text .s {
      font-family: var(--font-mono);
      font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-mute);
    }

    .cms-search {
      padding: 12px 14px 10px;
      position: relative;
    }
    .cms-search input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 12.5px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .cms-search input:focus { border-color: var(--red-warm); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10); }
    .cms-search input::placeholder { color: var(--text-mute); }
    .cms-search > svg {
      position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: var(--text-mute);
    }
    .cms-search kbd {
      position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-mute); background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .cms-nav {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 20px;
    }
    .cms-nav::-webkit-scrollbar { width: 6px; }
    .cms-nav::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    .cms-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--text-soft);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
      position: relative;
      margin-top: 2px;
    }
    .cms-link:hover { background: var(--surface-2); color: var(--text); }
    .cms-link.is-active {
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
    }
    .cms-link.is-active::before {
      content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 3px; background: var(--red-warm); border-radius: 2px;
    }
    .cms-link svg { width: 14px; height: 14px; color: var(--text-mute); flex-shrink: 0; }
    .cms-link.is-active svg { color: var(--red); }
    .cms-link-label { flex: 1; }

    .cms-group { margin-top: 4px; }
    .cms-group-head {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      background: none; border: 0;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.8px; text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: background .15s;
    }
    .cms-group-head:hover { background: var(--surface-2); }
    .cms-group-chevron {
      width: 12px; height: 12px;
      color: var(--text-mute);
      transition: transform .2s var(--ease);
      flex-shrink: 0;
    }
    .cms-group[aria-expanded="true"] .cms-group-chevron { transform: rotate(90deg); }
    .cms-group-icon { width: 14px; height: 14px; color: var(--text-mute); flex-shrink: 0; }
    .cms-group-title { flex: 1; }
    .cms-group-count {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-mute);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .cms-group-items {
      display: none;
      list-style: none;
      padding: 2px 0 6px 20px;
      margin-left: 6px;
      border-left: 1px solid var(--line);
    }
    .cms-group[aria-expanded="true"] .cms-group-items { display: block; }

    .cms-subgroup {
      padding: 10px 12px 4px;
      font-family: var(--font-mono);
      font-size: 9.5px; font-weight: 600;
      letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--text-mute);
    }
    .cms-subgroup:first-child { padding-top: 4px; }

    .cms-page-link {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      border-radius: 6px;
      color: var(--text-soft);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .cms-page-link:hover { background: var(--surface-2); color: var(--text); }
    .cms-page-link.is-active {
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
    }
    .cms-page-link.is-active::before {
      content: ''; position: absolute;
      left: -21px; top: 8px; bottom: 8px;
      width: 2px; background: var(--red-warm); border-radius: 2px;
    }
    .cms-page-link-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-page-status {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0;
    }
    .cms-page-status.is-published { background: var(--green); }
    .cms-page-status.is-draft { background: var(--amber); }

    .cms-divider {
      height: 1px; background: var(--line);
      margin: 12px 14px;
    }

    .cms-user {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
    }
    .cms-user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red-warm), var(--red));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .cms-user-text { flex: 1; min-width: 0; line-height: 1.2; }
    .cms-user-text .n { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .cms-user-text .r { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-mute); }
    .cms-user-arrow { width: 12px; height: 12px; color: var(--text-mute); }

    /* ═══ MAIN ═══ */
    .cms-main {
      grid-area: main;
      background: var(--bg);
      overflow-y: auto;
    }
    .cms-main::-webkit-scrollbar { width: 8px; }
    .cms-main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    .cms-jumpbar {
      position: sticky; top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 12px 40px;
      display: flex; align-items: center; gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cms-jumpbar::-webkit-scrollbar { display: none; }
    .cms-jumpbar-label {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--text-mute);
      flex-shrink: 0;
    }
    .cms-jumpbar-list {
      display: flex; gap: 4px;
      list-style: none;
    }
    .cms-jumpbar-list a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--text-soft);
      font-size: 12.5px; font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .cms-jumpbar-list a:hover { background: var(--surface); color: var(--text); }
    .cms-jumpbar-list a.is-active {
      background: var(--red-soft);
      color: var(--red);
    }
    .cms-jumpbar-num {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.4px;
      color: var(--text-mute);
    }
    .cms-jumpbar-list a.is-active .cms-jumpbar-num { color: var(--red); }

    .editor-wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 40px 96px;
    }

    /* Page banner */
    .page-banner {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 22px 26px;
      display: flex; align-items: flex-start; gap: 20px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
    }
    .page-banner-body { flex: 1; min-width: 0; }
    .page-banner-eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 2.2px; text-transform: uppercase;
      color: var(--red);
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .page-banner-eyebrow::before {
      content: ''; width: 18px; height: 1.5px; background: var(--red);
    }
    .page-banner h1 {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-banner-meta {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--text-mute);
      margin-top: 8px;
    }
    .page-banner-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-3); }
    .page-banner-meta a { color: var(--text-soft); border-bottom: 1px solid var(--line-2); }
    .page-banner-meta a:hover { color: var(--red); border-color: var(--red); }
    .page-banner-meta strong { color: var(--text); font-weight: 600; }
    .page-banner-status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 12px 5px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      border: 1px solid rgba(22, 163, 74, 0.25);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      flex-shrink: 0;
    }
    .page-banner-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    }
    .page-banner-status.is-draft {
      background: var(--amber-soft);
      border-color: rgba(217, 119, 6, 0.25);
      color: var(--amber);
    }
    .page-banner-status.is-draft::before { background: var(--amber); }

    /* Section block */
    .section-block { margin-top: 40px; scroll-margin-top: 80px; }
    .section-block:first-of-type { margin-top: 24px; }
    .section-block-head {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 0 4px 14px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .section-block-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: var(--red-soft);
      color: var(--red);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-block-icon svg { width: 17px; height: 17px; }
    .section-block-meta { flex: 1; min-width: 0; }
    .section-block-title {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.012em;
      color: var(--text);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .section-block-anchor {
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.4px;
      color: var(--text-mute);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .section-block-note {
      font-size: 13px;
      color: var(--text-mute);
      margin-top: 3px;
    }
    .section-block-actions { display: flex; gap: 4px; margin-top: 6px; }
    .icon-ghost {
      width: 30px; height: 30px;
      border-radius: 7px;
      border: 0; background: transparent;
      color: var(--text-mute);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .icon-ghost:hover { background: var(--surface-2); color: var(--text); }
    .icon-ghost svg { width: 14px; height: 14px; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 22px 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s;
    }
    .card:focus-within { border-color: var(--line-2); box-shadow: var(--shadow-md); }
    .card-title {
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .card-title-icon {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--red-soft);
      color: var(--red);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-title-icon svg { width: 12px; height: 12px; }
    .card-title-text { flex: 1; }
    .card-title-hint {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text-mute);
    }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .field-row .field { margin-bottom: 0; }
    .field-label {
      font-size: 13px; font-weight: 600;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .field-label .req { color: var(--red); font-weight: 700; }
    .field-label .badge {
      font-family: var(--font-mono);
      font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.8px;
      color: var(--text-mute);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
      text-transform: uppercase;
    }
    .field-help {
      font-size: 12px;
      color: var(--text-mute);
      margin-top: 2px;
    }
    .field-input, .field-textarea, .field-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      font-family: var(--font-body);
    }
    .field-input::placeholder, .field-textarea::placeholder { color: var(--text-mute); }
    .field-input:hover, .field-textarea:hover, .field-select:hover { border-color: var(--line-2); }
    .field-input:focus, .field-textarea:focus, .field-select:focus {
      border-color: var(--red-warm);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
    }
    .field-textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
    .field-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-with-icon { position: relative; }
    .field-with-icon .field-input { padding-left: 36px; }
    .field-with-icon > svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: var(--text-mute);
    }
    .field-counter {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-mute);
      margin-top: 2px;
    }
    .field-counter .ok { color: var(--green); }
    .field-counter .warn { color: var(--amber); }

    /* Media slot */
    .media-slot {
      display: flex; align-items: center; gap: 14px;
      padding: 12px;
      background: var(--surface-3);
      border: 1px dashed var(--line-2);
      border-radius: 10px;
      transition: border-color .15s, background .15s;
    }
    .media-slot:hover { border-color: var(--line-3); background: var(--surface); }
    .media-slot-thumb {
      width: 64px; height: 64px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--line);
      color: var(--text-mute);
    }
    .media-slot-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .media-slot-thumb svg { width: 22px; height: 22px; }
    .media-slot-body { flex: 1; min-width: 0; }
    .media-slot-body .n { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-slot-body .m { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); letter-spacing: 0.4px; }
    .media-slot-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Repeater */
    .repeater { display: flex; flex-direction: column; gap: 8px; }
    .repeater-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px 12px 12px;
      display: flex; align-items: center; gap: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .repeater-item:hover { border-color: var(--line-2); box-shadow: var(--shadow-sm); }
    .repeater-drag {
      width: 22px; height: 22px;
      color: var(--text-mute);
      cursor: grab;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      opacity: 0.4;
      transition: opacity .15s;
    }
    .repeater-item:hover .repeater-drag { opacity: 1; }
    .repeater-drag svg { width: 14px; height: 14px; }
    .repeater-num {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      color: var(--text-mute);
      background: var(--surface-2);
      border-radius: 5px;
      padding: 2px 7px;
      letter-spacing: 0.8px;
      flex-shrink: 0;
    }
    .repeater-item-body { flex: 1; min-width: 0; line-height: 1.35; }
    .repeater-item-body .t { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repeater-item-body .d { font-size: 12px; color: var(--text-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repeater-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .repeater-add {
      padding: 10px;
      background: transparent;
      border: 1px dashed var(--line-2);
      border-radius: 10px;
      color: var(--text-mute);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: color .15s, border-color .15s, background .15s;
    }
    .repeater-add:hover {
      color: var(--red);
      border-color: var(--red);
      background: var(--red-soft);
    }
    .repeater-add svg { width: 14px; height: 14px; }

    /* Empty state placeholder text */
    .empty-hint {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-mute);
      font-size: 13px;
      background: var(--surface-3);
      border: 1px dashed var(--line);
      border-radius: 10px;
    }
    .empty-hint svg { width: 32px; height: 32px; margin-bottom: 10px; opacity: 0.5; }

    /* Toasts — stack in bottom-right */
    .cms-toasts {
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 200;
      display: flex; flex-direction: column; gap: 10px;
      max-width: 400px;
      pointer-events: none;
    }
    .cms-toast {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 10px;
      padding: 12px 40px 12px 14px;
      box-shadow: var(--shadow-lg);
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 13px;
      pointer-events: auto;
      opacity: 0;
      transform: translateX(120%);
      transition: transform .35s var(--ease), opacity .25s;
      position: relative;
    }
    .cms-toast.show { opacity: 1; transform: translateX(0); }
    .cms-toast--error   { border-left-color: var(--red-warm); }
    .cms-toast--warn    { border-left-color: var(--amber); }
    .cms-toast--info    { border-left-color: var(--blue); }
    .cms-toast-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .cms-toast--error   .cms-toast-icon { background: var(--red-warm); }
    .cms-toast--warn    .cms-toast-icon { background: var(--amber); }
    .cms-toast--info    .cms-toast-icon { background: var(--blue); }
    .cms-toast-icon svg { width: 12px; height: 12px; }
    .cms-toast-body { flex: 1; min-width: 0; }
    .cms-toast-title { font-weight: 600; margin-bottom: 2px; }
    .cms-toast-desc  { color: var(--text-mute); font-size: 12.5px; line-height: 1.45; }
    .cms-toast-close {
      position: absolute; top: 8px; right: 8px;
      width: 22px; height: 22px; border-radius: 4px;
      border: 0; background: transparent; color: var(--text-mute);
      cursor: pointer;
    }
    .cms-toast-close:hover { background: var(--surface-2); color: var(--text); }
    .cms-toast-close svg { width: 12px; height: 12px; }

    /* Modal */
    .cms-modal-backdrop {
      position: fixed; inset: 0;
      z-index: 150;
      background: rgba(17, 24, 39, 0.5);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .cms-modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .cms-modal {
      background: var(--surface);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      max-width: 460px; width: 100%;
      transform: translateY(20px) scale(0.98);
      transition: transform .25s var(--ease);
    }
    .cms-modal-backdrop.show .cms-modal { transform: translateY(0) scale(1); }
    .cms-modal-head {
      padding: 20px 24px 12px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .cms-modal-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cms-modal-icon.is-danger  { background: var(--red-soft); color: var(--red); }
    .cms-modal-icon.is-warn    { background: var(--amber-soft); color: var(--amber); }
    .cms-modal-icon.is-info    { background: var(--blue-soft); color: var(--blue); }
    .cms-modal-icon.is-success { background: var(--green-soft); color: var(--green); }
    .cms-modal-icon svg { width: 20px; height: 20px; }
    .cms-modal-title {
      font-family: var(--font-display);
      font-size: 17px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.008em;
    }
    .cms-modal-body {
      padding: 0 24px 20px 78px;
      color: var(--text-soft);
      font-size: 13.5px;
      line-height: 1.55;
    }
    .cms-modal-body strong { color: var(--text); font-weight: 600; }
    .cms-modal-body ul { margin: 10px 0 0 18px; }
    .cms-modal-body li { margin-top: 4px; }
    .cms-modal-actions {
      padding: 14px 20px;
      background: var(--surface-3);
      border-top: 1px solid var(--line);
      border-radius: 0 0 var(--r-lg) var(--r-lg);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .cms-btn--danger {
      background: linear-gradient(180deg, var(--red-warm) 0%, var(--red) 100%);
      border-color: var(--red);
      color: #fff;
    }
    .cms-btn--danger:hover { background: var(--red-warm); }
    .cms-btn:disabled, .cms-btn[disabled] { opacity: 0.55; cursor: not-allowed; pointer-events: none; }

    /* Save/publish button loading state */
    .cms-btn.is-loading {
      color: transparent !important;
      pointer-events: none;
    }
    .cms-btn.is-loading::after {
      content: ''; position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      transform: translate(-50%, -50%);
      animation: spin .7s linear infinite;
    }
    .cms-btn { position: relative; }
    .cms-btn.is-loading:not(.cms-btn--primary):not(.cms-btn--danger)::after {
      border-color: rgba(17, 24, 39, 0.15);
      border-top-color: var(--text);
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Form validation */
    .field.is-invalid .field-input,
    .field.is-invalid .field-textarea,
    .field.is-invalid .field-select {
      border-color: var(--red-warm);
      background: rgba(220, 38, 38, 0.03);
    }
    .field.is-invalid .field-input:focus,
    .field.is-invalid .field-textarea:focus,
    .field.is-invalid .field-select:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    .field-error {
      display: none;
      font-size: 12px;
      color: var(--red-warm);
      margin-top: 2px;
      align-items: center;
      gap: 6px;
    }
    .field-error svg { width: 12px; height: 12px; }
    .field.is-invalid .field-error { display: flex; }

    /* Empty state */
    .empty-state {
      padding: 40px 24px;
      background: var(--surface-3);
      border: 1px dashed var(--line-2);
      border-radius: 12px;
      text-align: center;
      color: var(--text-mute);
    }
    .empty-state-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-mute);
      margin-bottom: 14px;
    }
    .empty-state-icon svg { width: 20px; height: 20px; }
    .empty-state-title {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .empty-state-desc {
      font-size: 12.5px;
      color: var(--text-mute);
      max-width: 340px;
      margin: 0 auto 14px;
      line-height: 1.55;
    }

    /* Media upload states */
    .media-slot.is-uploading .media-slot-thumb {
      position: relative;
    }
    .media-slot.is-uploading .media-slot-thumb::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.85);
      z-index: 1;
      border-radius: inherit;
    }
    .media-slot.is-uploading .media-slot-thumb::after {
      content: ''; position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(17, 24, 39, 0.15);
      border-top-color: var(--red-warm);
      transform: translate(-50%, -50%);
      animation: spin .7s linear infinite;
      z-index: 2;
    }
    .media-progress {
      height: 3px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .media-progress-bar {
      height: 100%;
      background: var(--red-warm);
      width: 0;
      transition: width .1s linear;
    }

    /* Status pill in banner — Draft/Published toggle */
    .page-banner-status { cursor: default; }
    .page-banner-status.is-dirty {
      background: var(--amber-soft);
      border-color: rgba(217, 119, 6, 0.25);
      color: var(--amber);
    }
    .page-banner-status.is-dirty::before { background: var(--amber); }

    /* Section Edit Modal — large, scrollable form-modal */
    .cms-modal.is-section-edit {
      max-width: 760px;
      max-height: 88vh;
      display: flex; flex-direction: column;
    }
    .cms-modal.is-section-edit .cms-modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-3);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }
    .cms-modal.is-section-edit .cms-modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      color: var(--text);
    }
    .cms-modal.is-section-edit .cms-modal-actions {
      background: var(--surface);
      border-top: 1px solid var(--line);
    }
    .cms-modal.is-section-edit .cms-modal-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--text-mute);
      margin-bottom: 4px;
    }
    /* Inside the section-edit modal the cards look flatter */
    .cms-modal.is-section-edit .card {
      box-shadow: none;
      border: 1px solid var(--line);
      margin-bottom: 14px;
      background: var(--surface-3);
    }
    .cms-modal.is-section-edit .card:last-child { margin-bottom: 0; }

    /* Section header: "Edit section" button styling */
    .section-edit-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .section-edit-btn:hover { background: var(--red-soft); color: var(--red); border-color: rgba(220,38,38,0.35); }
    .section-edit-btn svg { width: 12px; height: 12px; }

    /* Responsive */
    @media (max-width: 1000px) {
      :root { --sidebar-w: 248px; }
      .editor-wrap { padding: 24px 24px 60px; }
      .cms-jumpbar { padding: 12px 24px; }
    }
    @media (max-width: 680px) {
      .cms { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
      .cms-sidebar { display: none; }
      .field-row, .field-inline { grid-template-columns: 1fr; }
      .cms-topbar { padding: 0 16px; }
      .cms-topbar-eyebrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="cms">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="cms-sidebar">
      <div class="cms-brand">
        <img src="assets/img/logo-fill.svg" alt="" />
        <div class="cms-brand-text">
          <span class="n">Powerhouse</span>
          <span class="s">Content Manager</span>
        </div>
      </div>

      <div class="cms-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search pages…" />
        <kbd>⌘K</kbd>
      </div>

      <nav class="cms-nav" id="cmsNav"><!-- Populated by JS --></nav>

      <div class="cms-user">
        <div class="cms-user-avatar">CI</div>
        <div class="cms-user-text">
          <div class="n">Chadi Irani</div>
          <div class="r">Admin</div>
        </div>
        <svg class="cms-user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </aside>

    <!-- ═══ TOP BAR ═══ -->
    <header class="cms-topbar">
      <div class="cms-topbar-left">
        <span class="cms-topbar-eyebrow" id="topEyebrow">Editing page ›</span>
        <span class="cms-topbar-title" id="topTitle">Home Page</span>
      </div>
      <div class="cms-topbar-right">
        <button class="cms-btn" title="Preview page in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview
        </button>
        <button class="cms-btn" id="btnSaveDraft" onclick="onSaveDraft()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <span class="cms-btn-label">Save Draft</span>
        </button>
        <button class="cms-btn cms-btn--primary" id="btnPublish" onclick="onPublishClick()">
          <span class="cms-btn-label">Publish</span>
          <kbd>⌘S</kbd>
        </button>
      </div>
    </header>

    <!-- ═══ MAIN ═══ -->
    <main class="cms-main">
      <div class="cms-jumpbar" id="jumpbar"><!-- populated --></div>
      <div class="editor-wrap" id="editor"><!-- populated --></div>
    </main>
  </div>

  <!-- Toast container (stack) -->
  <div class="cms-toasts" id="cmsToasts"></div>

  <!-- Section Edit Modal — dedicated large modal that opens when user clicks "Edit" on a section -->
  <div class="cms-modal-backdrop" id="sectionEditModal">
    <div class="cms-modal is-section-edit" role="dialog" aria-modal="true" aria-labelledby="sectionEditTitle">
      <div class="cms-modal-head">
        <div class="cms-modal-icon is-info" id="sectionEditIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="cms-modal-eyebrow" id="sectionEditEyebrow">Editing section</div>
          <div class="cms-modal-title" id="sectionEditTitle">Section</div>
        </div>
        <button class="icon-ghost" onclick="closeSectionEdit()" style="margin-left:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="cms-modal-body" id="sectionEditBody"><!-- fields injected --></div>
      <div class="cms-modal-actions">
        <button class="cms-btn" onclick="closeSectionEdit()">Cancel</button>
        <button class="cms-btn cms-btn--primary" id="sectionEditSave" onclick="saveSectionEdit()">Save changes</button>
      </div>
    </div>
  </div>

  <!-- Confirmation modal (delete / publish / unsaved) -->
  <div class="cms-modal-backdrop" id="cmsModal">
    <div class="cms-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="cms-modal-head">
        <div class="cms-modal-icon is-danger" id="modalIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="cms-modal-title" id="modalTitle">Confirm action</div>
        </div>
      </div>
      <div class="cms-modal-body" id="modalBody">Are you sure?</div>
      <div class="cms-modal-actions">
        <button class="cms-btn" id="modalCancel" onclick="closeModal()">Cancel</button>
        <button class="cms-btn cms-btn--danger" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       ICON LIBRARY (inline SVGs used by section headers + card titles)
       ═══════════════════════════════════════════════════════════════ */
    const ICON = {
      text:     '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>',
      button:   '<rect x="3" y="8" width="18" height="8" rx="2"/><line x1="7" y1="12" x2="17" y2="12"/>',
      image:    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',

    let currentId = 'home';

    function renderSidebar() {
      const nav = document.getElementById('cmsNav');
      const parts = NAV.map(item => {
        if (item.type === 'link') {
          return `<a class="cms-link" href="#" data-page-id="${item.id}">
            ${svg(item.icon)}
            <span class="cms-link-label">${item.label}</span>
            ${item.status ? `<span class="cms-page-status is-${item.status}"></span>` : ''}
          </a>`;
        }
        if (item.type === 'group') {
          const children = item.children.map(c => {
            if (c.type === 'sub') return `<li class="cms-subgroup">${c.label}</li>`;
            return `<li><a class="cms-page-link" href="#" data-page-id="${c.id}">
              <span class="cms-page-link-label">${c.label}</span>
              <span class="cms-page-status is-${c.status}"></span>
            </a></li>`;
          }).join('');
          const pageCount = item.children.filter(c => c.type === 'page').length;
          return `<div class="cms-group" aria-expanded="${item.open}">
            <button class="cms-group-head" data-toggle>
              <svg class="cms-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
              <span class="cms-group-icon">${svg(item.icon)}</span>
              <span class="cms-group-title">${item.label}</span>
              <span class="cms-group-count">${pageCount}</span>
            </button>
            <ul class="cms-group-items">${children}</ul>
          </div>`;
        }
        if (item.type === 'divider') return `<div class="cms-divider"></div>`;
        return '';
      });
      nav.innerHTML = parts.join('');

      nav.querySelectorAll('.cms-group-head[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const group = btn.closest('.cms-group');
          const open = group.getAttribute('aria-expanded') === 'true';
          group.setAttribute('aria-expanded', String(!open));
        });
      });
      nav.querySelectorAll('[data-page-id]').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          switchPage(link.dataset.pageId);
        });
      });
    }

    function renderField(f) {
      if (f.type === 'row') return `<div class="field-row">${f.fields.map(x => `<div class="field">${renderFieldInner(x)}</div>`).join('')}</div>`;
      return `<div class="field">${renderFieldInner(f)}</div>`;
    }
    function renderFieldInner(f) {
      const req = f.required ? ' data-required="1"' : '';
      const label = f.label ? `<label class="field-label">${f.label} ${f.required ? '<span class="req">*</span>' : ''} ${f.badge ? `<span class="badge">${f.badge}</span>` : ''}</label>` : '';
      const help  = f.help ? `<div class="field-help">${f.help}</div>` : '';
      const counter = f.counter ? `<div class="field-counter"><span></span><span class="${f.counter[0] <= f.counter[1] ? 'ok' : 'warn'}">${f.counter[0]} / ${f.counter[1]}</span></div>` : '';
      const errMsg = f.required ? `<div class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>This field is required</div>` : '';
      switch (f.type) {
        case 'text':
          return `${label}<input class="field-input" type="text" value="${escapeAttr(f.value || '')}"${req} />${errMsg}${help}${counter}`;
        case 'textarea':
          return `${label}<textarea class="field-textarea" rows="${f.rows || 3}"${req}>${escapeHtml(f.value || '')}</textarea>${errMsg}${help}${counter}`;
        case 'cta':
          return `${label}<div class="field-inline">
            <input class="field-input" type="text" value="${escapeAttr(f.labelValue)}" placeholder="Label" />
            <div class="field-with-icon">${svg(f.linkIcon || 'text')}<input class="field-input" type="text" value="${escapeAttr(f.linkValue)}" placeholder="Link" /></div>
          </div>`;
        case 'media':
          const thumbInner = f.placeholder
            ? svg('image', 22)
            : `<img src="${f.src}" alt="" onerror="this.style.display='none'" />`;
          return `${label}<div class="media-slot">
            <div class="media-slot-thumb" ${f.bg ? `style="background:${f.bg};padding:6px;"` : ''}>${thumbInner}</div>
            <div class="media-slot-body">
              <div class="n">${f.name}</div>
              <div class="m">${f.meta}</div>
              <div class="media-progress" style="display:none;"><div class="media-progress-bar"></div></div>
            </div>
            <div class="media-slot-actions">
              <button class="cms-btn" onclick="onReplaceMedia(this)">Replace</button>
              <button class="icon-ghost" title="Remove" onclick="onRemoveMedia(this, '${escapeAttr(f.name)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </div>
          </div>`;
        case 'repeater': {
          const repId = 'rep-' + (++__repIdCounter);
          const schema = f.itemSchema || DEFAULT_ITEM_SCHEMA;
          REPEATER_REGISTRY[repId] = { items: f.items || [], schema, itemLabel: f.itemLabel || (f.addLabel ? f.addLabel.replace(/^Add\s+/i, '') : 'Item') };
          if (!f.items || !f.items.length) {
            return `${label}<div class="empty-state" data-rep-id="${repId}">
              <div class="empty-state-icon">${svg('list', 20)}</div>
              <div class="empty-state-title">No items yet</div>
              <div class="empty-state-desc">${f.emptyHint || "Nothing here to show — add your first item to get started."}</div>
              <button class="cms-btn cms-btn--primary" onclick="addRepeaterItem(this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                ${f.addLabel || 'Add item'}
              </button>
            </div>`;
          }
          const primaryKey = schema[0].key;
          const secondaryKey = schema[1] ? schema[1].key : null;
          const rows = f.items.map((it, i) => `
            <div class="repeater-item" data-idx="${i}">
              <span class="repeater-num">${String(i+1).padStart(2, '0')}</span>
              <div class="repeater-item-body">
                <div class="t">${escapeHtml(it[primaryKey] || it.t || '')}</div>
                ${(secondaryKey && it[secondaryKey]) || it.d ? `<div class="d">${escapeHtml((secondaryKey && it[secondaryKey]) || it.d || '')}</div>` : ''}
              </div>
              <div class="repeater-actions">
                <button class="icon-ghost" title="Edit" onclick="onEditItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
                <button class="icon-ghost" title="Remove" onclick="onDeleteItem(this, '${escapeAttr(it[primaryKey] || it.t || '')}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
              </div>
            </div>`).join('');
          return `${label}<div class="repeater" data-rep-id="${repId}">${rows}
            <button class="repeater-add" onclick="addRepeaterItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${f.addLabel || 'Add item'}</button>
          </div>`;
        }
      }
      return '';
    }

    function renderCard(c) {
      return `<div class="card">
        <div class="card-title">
          <span class="card-title-icon">${svg(c.icon || 'text', 12)}</span>
          <span class="card-title-text">${c.title}</span>
          ${c.hint ? `<span class="card-title-hint">${c.hint}</span>` : ''}
        </div>
        ${c.fields.map(renderField).join('')}
      </div>`;
    }

    function renderSection(s) {
      return `<div class="section-block" id="s-${s.id}" data-section-id="${s.id}">
        <div class="section-block-head">
          <div class="section-block-icon">${svg(s.icon || 'text', 17)}</div>
          <div class="section-block-meta">
            <div class="section-block-title">${s.title} ${s.anchor || s.id ? `<span class="section-block-anchor">#${s.anchor || s.id}</span>` : ''}</div>
            <div class="section-block-note">${s.note || ''}</div>
          </div>
          <div class="section-block-actions">
            <button class="section-edit-btn" onclick="openSectionEdit('${s.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
              Edit
            </button>
            <button class="icon-ghost" title="Preview on the live site" onclick="onPreviewSection('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        ${s.cards.map(renderCard).join('')}
      </div>`;
    }

    let dirty = false; // page has unsaved edits

    function renderPage(id) {
      const p = PAGES[id];
      if (!p) return;
      currentId = id;
      dirty = false;

      // Top bar
      document.getElementById('topTitle').textContent = p.name;
      resetSaveButtons();

      // Jumpbar
      const jumpbar = document.getElementById('jumpbar');
      jumpbar.innerHTML = `
        <span class="cms-jumpbar-label">Sections</span>
        <ul class="cms-jumpbar-list">
          ${p.sections.map((s, i) => `<li><a data-jump="s-${s.id}" class="${i===0?'is-active':''}"><span class="cms-jumpbar-num">${String(i+1).padStart(2,'0')}</span> ${s.title.replace(' Section','').replace(' Row','').replace(' List','')}</a></li>`).join('')}
        </ul>`;
      jumpbar.querySelectorAll('[data-jump]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          jumpbar.querySelectorAll('[data-jump]').forEach(x => x.classList.remove('is-active'));
          a.classList.add('is-active');
          const t = document.getElementById(a.dataset.jump);
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      // Editor body — page banner + sections
      const editor = document.getElementById('editor');
      const statusClass = p.status === 'draft' ? 'is-draft' : (p.status === 'system' ? 'is-draft' : '');
      const statusLabel = p.status === 'draft' ? 'Draft' : (p.status === 'system' ? 'System' : 'Published');
      const urlLine = p.url ? `<a href="${p.url}" target="_blank">powerhouselaw.com.au/${p.url}</a><span class="dot"></span>` : '';
      editor.innerHTML = `
        <div class="page-banner">
          <div class="page-banner-body">
            <span class="page-banner-eyebrow">${p.name}</span>
            <h1>${p.name}</h1>
            <div class="page-banner-meta">
              ${urlLine}
              <span>Last edited by <strong>${p.editor}</strong>, ${p.edited}</span>
              <span class="dot"></span>
              <span>${p.version}</span>
            </div>
          </div>
          <span class="page-banner-status ${statusClass}" id="bannerStatus">${statusLabel}</span>
        </div>
        ${p.sections.map(renderSection).join('')}
      `;

      // Scroll spy for jumpbar
      const sections = editor.querySelectorAll('.section-block[id]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const id = e.target.id;
            jumpbar.querySelectorAll('[data-jump]').forEach(a => {
              a.classList.toggle('is-active', a.dataset.jump === id);
            });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      sections.forEach(s => observer.observe(s));

      // Wire up dirty tracking
      editor.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', markDirty);
        el.addEventListener('change', markDirty);
        el.addEventListener('blur', () => {
          // Re-validate this field on blur
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) {
            wrap.classList.add('is-invalid');
          } else if (wrap) {
            wrap.classList.remove('is-invalid');
          }
        });
      });

      // Scroll main to top on switch
      document.querySelector('.cms-main').scrollTo({ top: 0, behavior: 'instant' });
    }

    function markDirty() {
      if (dirty) return;
      dirty = true;
      const banner = document.getElementById('bannerStatus');
      if (banner) {
        banner.classList.add('is-dirty');
        banner.textContent = 'Unsaved';
      }
      const saveBtn = document.getElementById('btnSaveDraft');
      if (saveBtn) saveBtn.classList.add('cms-btn--attn');
    }

    function resetSaveButtons() {
      const s = document.getElementById('btnSaveDraft');
      const p = document.getElementById('btnPublish');
      if (s) { s.classList.remove('is-loading'); s.querySelector('.cms-btn-label').textContent = 'Save Draft'; }
      if (p) { p.classList.remove('is-loading'); p.querySelector('.cms-btn-label').textContent = 'Publish'; }
    }

    function switchPage(id) {
      if (dirty && id !== currentId) {
        openModal({
          icon: 'warn',
          title: 'You have unsaved changes',
          body: `Your changes to <strong>${PAGES[currentId].name}</strong> haven't been saved yet. Leaving this page will discard them.`,
          confirmLabel: 'Discard & switch',
          confirmVariant: 'danger',
          onConfirm: () => {
            closeModal();
            dirty = false;
            actuallySwitchPage(id);
          }
        });
        return;
      }
      actuallySwitchPage(id);
    }
    function actuallySwitchPage(id) {
      document.querySelectorAll('.cms-link, .cms-page-link').forEach(l => l.classList.remove('is-active'));
      document.querySelectorAll(`[data-page-id="${id}"]`).forEach(l => l.classList.add('is-active'));
      renderPage(id);
    }

    /* ═══ Helpers ═══ */
    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
    function escapeAttr(str) { return escapeHtml(str); }

    /* ═══ Toast system ═══ */
    function toast({ type='success', title, desc, timeout=3600 } = {}) {
      const host = document.getElementById('cmsToasts');
      const el = document.createElement('div');
      el.className = 'cms-toast cms-toast--' + type;
      const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>',
        error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        warn:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      el.innerHTML = `
        <span class="cms-toast-icon">${icons[type] || icons.success}</span>
        <div class="cms-toast-body">
          <div class="cms-toast-title">${title}</div>
          ${desc ? `<div class="cms-toast-desc">${desc}</div>` : ''}
        </div>
        <button class="cms-toast-close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      host.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      const kill = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); };
      el.querySelector('.cms-toast-close').addEventListener('click', kill);
      if (timeout) setTimeout(kill, timeout);
      return el;
    }

    /* ═══ Modal system ═══ */
    let modalOnConfirm = null;
    function openModal({ icon='danger', title, body, confirmLabel='Confirm', cancelLabel='Cancel', confirmVariant='danger', onConfirm=null }) {
      const modal = document.getElementById('cmsModal');
      const iconEl = document.getElementById('modalIcon');
      const iconMap = {
        danger:  { cls: 'is-danger',  svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' },
        warn:    { cls: 'is-warn',    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
        info:    { cls: 'is-info',    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' },
        success: { cls: 'is-success', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' }
      };
      const cfg = iconMap[icon] || iconMap.danger;
      iconEl.className = 'cms-modal-icon ' + cfg.cls;
      iconEl.innerHTML = cfg.svg;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      const confirmBtn = document.getElementById('modalConfirm');
      confirmBtn.textContent = confirmLabel;
      confirmBtn.className = 'cms-btn ' + (confirmVariant === 'primary' ? 'cms-btn--primary' : 'cms-btn--danger');
      document.getElementById('modalCancel').textContent = cancelLabel;
      modalOnConfirm = onConfirm;
      confirmBtn.onclick = () => { if (modalOnConfirm) modalOnConfirm(); };
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('cmsModal').classList.remove('show');
      document.body.style.overflow = '';
      modalOnConfirm = null;
    }
    // Backdrop click dismisses
    document.getElementById('cmsModal').addEventListener('click', (e) => {
      if (e.target.id === 'cmsModal') closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ═══ Form validation ═══ */
    function validatePage() {
      const missing = [];
      document.querySelectorAll('.editor-wrap input[data-required], .editor-wrap textarea[data-required]').forEach(el => {
        const wrap = el.closest('.field');
        if (!el.value.trim()) {
          wrap.classList.add('is-invalid');
          missing.push(wrap.querySelector('.field-label')?.textContent.replace('*', '').trim());
        } else {
          wrap.classList.remove('is-invalid');
        }
      });
      return missing;
    }

    /* ═══ Save & Publish flows ═══ */
    function onSaveDraft() {
      const btn = document.getElementById('btnSaveDraft');
      btn.classList.add('is-loading');
      setTimeout(() => {
        btn.classList.remove('is-loading');
        dirty = false;
        const banner = document.getElementById('bannerStatus');
        if (banner) banner.classList.remove('is-dirty');
        toast({ type: 'success', title: 'Draft saved',
                desc: `Your changes to ${PAGES[currentId].name} were saved as a draft. The live site is unchanged.` });
      }, 700);
    }
    function onPublishClick() {
      const missing = validatePage();
      if (missing.length) {
        // Scroll to first invalid field
        const first = document.querySelector('.field.is-invalid');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toast({ type: 'error', title: `${missing.length} required field${missing.length === 1 ? '' : 's'} missing`,
                desc: 'Fill in the highlighted fields before publishing.' });
        return;
      }
      openModal({
        icon: 'info',
        title: `Publish "${PAGES[currentId].name}"?`,
        body: `<p>Your changes will go live on <strong>powerhouselaw.com.au</strong> immediately.</p>
               <ul>
                 <li>Visitors will see the updated content on their next page load.</li>
                 <li>Search engines will re-index within 24 hours.</li>
                 <li>You can roll back to the previous version at any time.</li>
               </ul>`,
        confirmLabel: 'Publish now',
        confirmVariant: 'primary',
        onConfirm: () => {
          closeModal();
          const btn = document.getElementById('btnPublish');
          btn.classList.add('is-loading');
          setTimeout(() => {
            btn.classList.remove('is-loading');
            dirty = false;
            const banner = document.getElementById('bannerStatus');
            if (banner) { banner.classList.remove('is-dirty'); banner.textContent = 'Published'; }
            toast({ type: 'success', title: `${PAGES[currentId].name} published`,
                    desc: 'Live on powerhouselaw.com.au. Roll back available in Version History.' });
          }, 900);
        }
      });
    }
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); onPublishClick(); }
    });
    // Warn before closing the tab with unsaved changes
    window.addEventListener('beforeunload', (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ═══ Item interactions (delete confirm / add / edit) ═══ */
    function onDeleteItem(btn, itemName) {
      openModal({
        icon: 'danger',
        title: 'Delete this item?',
        body: `<strong>${escapeHtml(itemName)}</strong> will be removed from this section. This cannot be undone once you publish.`,
        confirmLabel: 'Delete',
        onConfirm: () => {
          closeModal();
          const item = btn.closest('.repeater-item');
          item.style.transition = 'opacity .2s, transform .2s';
          item.style.opacity = '0';
          item.style.transform = 'translateX(-8px)';
          setTimeout(() => {
            item.remove();
            renumberRepeater(btn.closest('.repeater'));
            markDirty();
            toast({ type: 'success', title: 'Item deleted',
                    desc: `"${itemName}" removed from this section.` });
          }, 220);
        }
      });
    }
    // ═══ Per-item edit registry + modal ═══
    const REPEATER_REGISTRY = {};
    let __repIdCounter = 0;
    let itemEditContext = null; // { repId, idx }
    const DEFAULT_ITEM_SCHEMA = [
      { label: 'Title', key: 't', type: 'text', required: true },
      { label: 'Description', key: 'd', type: 'textarea', rows: 2 }
    ];

    function onEditItem(btn) {
      const row = btn.closest('.repeater-item');
      const rep = btn.closest('.repeater');
      if (!row || !rep) return;
      const idx = parseInt(row.dataset.idx, 10);
      const repId = rep.dataset.repId;
      const reg = REPEATER_REGISTRY[repId];
      if (!reg) return;
      const data = reg.items[idx] || {};
      const schema = reg.schema || DEFAULT_ITEM_SCHEMA;

      itemEditContext = { repId, idx };

      document.getElementById('sectionEditEyebrow').textContent = `${PAGES[currentId].name} · Editing ${reg.itemLabel.toLowerCase()}`;
      document.getElementById('sectionEditTitle').textContent = `${reg.itemLabel} · ${String(idx + 1).padStart(2, '0')}`;

      const fieldsHtml = schema.map(f => renderField({
        type: f.type || 'text',
        label: f.label,
        required: f.required,
        rows: f.rows,
        value: data[f.key] != null ? data[f.key] : '',
        help: f.help,
        badge: f.badge,
        placeholder: f.placeholder
      })).join('');

      document.getElementById('sectionEditBody').innerHTML = `<div class="card">
        <div class="card-title">
          <span class="card-title-icon">${svg('text', 12)}</span>
          <span class="card-title-text">${reg.itemLabel} details</span>
        </div>
        ${fieldsHtml}
      </div>`;

      const body = document.getElementById('sectionEditBody');
      body.dataset.dirty = '';
      body.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { body.dataset.dirty = '1'; });
        el.addEventListener('blur', () => {
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) wrap.classList.add('is-invalid');
          else if (wrap) wrap.classList.remove('is-invalid');
        });
      });
      document.getElementById('sectionEditModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function addRepeaterItem(btn) {
      const rep = btn.closest('.card').querySelector('.repeater') || btn.closest('.empty-state');
      if (rep && rep.classList.contains('empty-state')) {
        // Was empty — replace with real repeater seed
        const parent = rep.parentElement;
        parent.innerHTML = `<div class="repeater">
          <div class="repeater-item"><span class="repeater-num">01</span>
            <div class="repeater-item-body"><div class="t">New item</div><div class="d">Click edit to fill this in.</div></div>
            <div class="repeater-actions">
              <button class="icon-ghost" onclick="onEditItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
              <button class="icon-ghost" onclick="onDeleteItem(this, 'New item')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </div>
          </div>
          <button class="repeater-add" onclick="addRepeaterItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add item</button>
        </div>`;
      } else if (rep) {
        const items = rep.querySelectorAll('.repeater-item');
        const num = String(items.length + 1).padStart(2, '0');
        const newItem = document.createElement('div');
        newItem.className = 'repeater-item';
        newItem.innerHTML = `<span class="repeater-num">${num}</span>
          <div class="repeater-item-body"><div class="t">New item</div><div class="d">Click edit to fill this in.</div></div>
          <div class="repeater-actions">
            <button class="icon-ghost" onclick="onEditItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
            <button class="icon-ghost" onclick="onDeleteItem(this, 'New item')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </div>`;
        rep.insertBefore(newItem, btn);
      }
      markDirty();
    }
    function renumberRepeater(rep) {
      if (!rep) return;
      rep.querySelectorAll('.repeater-item').forEach((it, i) => {
        const n = it.querySelector('.repeater-num');
        if (n) n.textContent = String(i + 1).padStart(2, '0');
      });
    }

    /* ═══ Media upload / remove / preview ═══ */
    function onReplaceMedia(btn) {
      const slot = btn.closest('.media-slot');
      const bar = slot.querySelector('.media-progress');
      const barInner = slot.querySelector('.media-progress-bar');
      slot.classList.add('is-uploading');
      bar.style.display = 'block';
      let pct = 0;
      const iv = setInterval(() => {
        pct += 8 + Math.random() * 12;
        if (pct >= 100) pct = 100;
        barInner.style.width = pct + '%';
        if (pct >= 100) {
          clearInterval(iv);
          setTimeout(() => {
            slot.classList.remove('is-uploading');
            bar.style.display = 'none';
            barInner.style.width = '0';
            markDirty();
            toast({ type: 'success', title: 'Image uploaded',
                    desc: 'Your new image has replaced the previous one. Publish to make it live.' });
          }, 300);
        }
      }, 100);
    }
    function onRemoveMedia(btn, name) {
      openModal({
        icon: 'danger',
        title: 'Remove this image?',
        body: `<strong>${escapeHtml(name)}</strong> will be removed from this field. The image will still be available in the Media Library.`,
        confirmLabel: 'Remove',
        onConfirm: () => {
          closeModal();
          const slot = btn.closest('.media-slot');
          slot.style.transition = 'opacity .2s';
          slot.style.opacity = '0.35';
          markDirty();
          toast({ type: 'success', title: 'Image removed',
                  desc: `"${name}" was removed from this field.` });
          setTimeout(() => { slot.style.opacity = '1'; }, 400);
        }
      });
    }
    function onPreviewSection(sectionId) {
      const url = PAGES[currentId].url;
      if (url) window.open(url + '#' + sectionId, '_blank');
      else toast({ type: 'info', title: 'Preview unavailable', desc: 'This page has no live URL to preview.' });
    }

    /* ═══ Section Edit Modal ═══
       Opens when the "Edit" button in a section header is clicked. Renders every card + field
       for that section inside a scrollable modal, pre-populated with existing content. */
    let currentEditSectionId = null;
    function openSectionEdit(sectionId) {
      const p = PAGES[currentId];
      const s = p.sections.find(x => x.id === sectionId);
      if (!s) return;
      currentEditSectionId = sectionId;
      document.getElementById('sectionEditEyebrow').textContent = `${p.name} · Editing section`;
      document.getElementById('sectionEditTitle').textContent = s.title;
      // Reuse the same card renderer so the modal shows every editable field
      document.getElementById('sectionEditBody').innerHTML = s.cards.map(renderCard).join('');
      // Wire dirty tracking on modal inputs
      const body = document.getElementById('sectionEditBody');
      body.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { body.dataset.dirty = '1'; });
        el.addEventListener('blur', () => {
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) wrap.classList.add('is-invalid');
          else if (wrap) wrap.classList.remove('is-invalid');
        });
      });
      document.getElementById('sectionEditModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeSectionEdit() {
      const body = document.getElementById('sectionEditBody');
      if (body.dataset.dirty === '1') {
        openModal({
          icon: 'warn',
          title: 'Discard changes?',
          body: 'You have unsaved edits in this section. Closing now will lose them.',
          confirmLabel: 'Discard',
          onConfirm: () => {
            closeModal();
            body.dataset.dirty = '';
            document.getElementById('sectionEditModal').classList.remove('show');
            document.body.style.overflow = '';
          }
        });
        return;
      }
      document.getElementById('sectionEditModal').classList.remove('show');
      document.body.style.overflow = '';
      currentEditSectionId = null;
      itemEditContext = null;
    }
    function saveSectionEdit() {
      // Validate required fields in the modal
      const modalBody = document.getElementById('sectionEditBody');
      const missing = [];
      modalBody.querySelectorAll('input[data-required], textarea[data-required]').forEach(el => {
        const wrap = el.closest('.field');
        if (!el.value.trim()) {
          wrap.classList.add('is-invalid');
          missing.push(wrap.querySelector('.field-label')?.textContent.replace('*', '').trim());
        } else {
          wrap.classList.remove('is-invalid');
        }
      });
      if (missing.length) {
        toast({ type: 'error', title: `${missing.length} required field${missing.length === 1 ? '' : 's'} missing`,
                desc: 'Fill in the highlighted fields before saving.' });
        return;
      }
      const saveBtn = document.getElementById('sectionEditSave');
      saveBtn.textContent = '';
      saveBtn.classList.add('is-loading');
      setTimeout(() => {
        saveBtn.classList.remove('is-loading');
        saveBtn.textContent = 'Save changes';

        if (itemEditContext) {
          // Persist changes into the repeater registry and re-render the affected row
          const reg = REPEATER_REGISTRY[itemEditContext.repId];
          const idx = itemEditContext.idx;
          const fields = modalBody.querySelectorAll('.field');
          reg.schema.forEach((f, i) => {
            const el = fields[i] && fields[i].querySelector('input, textarea, select');
            if (el) reg.items[idx][f.key] = el.value;
          });
          const rep = document.querySelector(`.repeater[data-rep-id="${itemEditContext.repId}"]`);
          if (rep) {
            const row = rep.querySelector(`.repeater-item[data-idx="${idx}"]`);
            if (row) {
              const primary = reg.items[idx][reg.schema[0].key] || '';
              const secondary = reg.schema[1] ? (reg.items[idx][reg.schema[1].key] || '') : '';
              const tEl = row.querySelector('.repeater-item-body .t');
              if (tEl) tEl.textContent = primary;
              let dEl = row.querySelector('.repeater-item-body .d');
              if (secondary) {
                if (!dEl) {
                  dEl = document.createElement('div');
                  dEl.className = 'd';
                  row.querySelector('.repeater-item-body').appendChild(dEl);
                }
                dEl.textContent = secondary;
              } else if (dEl) {
                dEl.remove();
              }
            }
          }
          modalBody.dataset.dirty = '';
          document.getElementById('sectionEditModal').classList.remove('show');
          document.body.style.overflow = '';
          markDirty();
          const label = reg.itemLabel || 'Item';
          toast({ type: 'success', title: `${label} updated`,
                  desc: `Changes to "${reg.items[idx][reg.schema[0].key] || ''}" saved. Publish to make them live.` });
          itemEditContext = null;
          return;
        }

        modalBody.dataset.dirty = '';
        document.getElementById('sectionEditModal').classList.remove('show');
        document.body.style.overflow = '';
        markDirty();
        toast({ type: 'success', title: 'Section updated',
                desc: `Your changes to "${PAGES[currentId].sections.find(s => s.id === currentEditSectionId).title}" have been saved. Publish to make them live.` });
        currentEditSectionId = null;
      }, 700);
    }
    // Backdrop click on the section edit modal
    document.getElementById('sectionEditModal').addEventListener('click', (e) => {
      if (e.target.id === 'sectionEditModal') closeSectionEdit();
    });

    /* ═══ Boot ═══ */
    renderSidebar();
    switchPage('home');
  </script>
</body>
</html>
