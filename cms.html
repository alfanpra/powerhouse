<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Powerhouse CMS — Content Manager</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="assets/img/logo-fill.svg" />

  <style>
    /* ═══════════════════════════════════════════════════════════════
       Filament 3-inspired design system
       — Inter typography, gray-100 backgrounds, ring-based borders,
         rounded-xl cards, taller form inputs, flat primary buttons.
       ═══════════════════════════════════════════════════════════════ */
    :root {
      /* Backgrounds */
      --bg:         #f9fafb;   /* gray-50 */
      --surface:    #ffffff;
      --surface-2:  #f3f4f6;   /* gray-100 */
      --surface-3:  #f9fafb;

      /* Text */
      --text:       #111827;   /* gray-900 */
      --text-soft:  #374151;   /* gray-700 */
      --text-mute:  #6b7280;   /* gray-500 */
      --text-faint: #9ca3af;   /* gray-400 */

      /* Borders / rings (Filament uses subtle rings, not shadows) */
      --line:       #e5e7eb;   /* gray-200 */
      --line-2:     #d1d5db;   /* gray-300 */
      --line-3:     #9ca3af;   /* gray-400 */
      --ring:       rgba(17, 24, 39, 0.05);   /* ring-gray-950/5 */
      --ring-focus: rgba(220, 38, 38, 0.20);

      /* Primary — Powerhouse red (kept as brand accent) */
      --red:        #b91c1c;   /* red-700 */
      --red-warm:   #dc2626;   /* red-600 */
      --red-hover:  #b91c1c;   /* red-700 for hover */
      --red-soft:   #fef2f2;   /* red-50 */
      --red-tint:   #fee2e2;   /* red-100 for active bg */

      /* Status */
      --green:      #16a34a;
      --green-soft: #f0fdf4;
      --amber:      #d97706;
      --amber-soft: #fffbeb;
      --blue:       #2563eb;
      --blue-soft:  #eff6ff;

      /* Typography — Filament uses Inter */
      --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      /* Radii — Filament uses larger rounded corners */
      --r-sm: 6px;    /* rounded-md */
      --r-md: 8px;    /* rounded-lg */
      --r-lg: 12px;   /* rounded-xl — cards */
      --r-xl: 16px;   /* rounded-2xl — modals */

      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --sidebar-w: 216px;   /* Filament sidebar is narrower */

      /* Shadows — replaced with subtle rings for Filament look */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --ring-1: 0 0 0 1px var(--line);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--red-tint); }

    .cms {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr);
      grid-template-areas: "sidebar topbar" "sidebar main";
      height: 100vh;
    }

    /* ═══ TOP BAR (Filament — search left, actions + avatar right) ═══ */
    .cms-topbar {
      grid-area: topbar;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .cms-topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .cms-topbar-right { display: flex; align-items: center; gap: 8px; }

    /* Filament topbar search — pill input with icon, positioned right-of-center */
    .cms-topbar-search {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-left: auto;
    }
    .cms-topbar-search > svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-mute); pointer-events: none;
    }
    .cms-topbar-search input {
      width: 100%;
      padding: 8px 40px 8px 36px;
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .cms-topbar-search input:focus { background: var(--surface); border-color: var(--line-2); box-shadow: 0 0 0 3px var(--ring-focus); }
    .cms-topbar-search input::placeholder { color: var(--text-mute); }
    .cms-topbar-search kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 10.5px;
      color: var(--text-mute); background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
    }

    /* Filament topbar user avatar — black circle with initials */
    .cms-topbar-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      margin-left: 4px;
      transition: opacity .15s;
    }
    .cms-topbar-avatar:hover { opacity: 0.85; }

    /* Filament notification badge on bell */
    .topbar-notif-badge {
      position: absolute; top: -3px; right: -3px;
      min-width: 15px; height: 15px;
      background: var(--red-warm);
      color: #fff;
      border: 2px solid var(--surface);
      border-radius: 999px;
      font-size: 9px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      line-height: 1;
    }

    .cms-saved {
      font-size: 12px;
      color: var(--text-mute);
      display: inline-flex; align-items: center; gap: 8px;
      margin-right: 6px;
    }
    .cms-saved::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .cms-saved.is-dirty { color: var(--amber); }
    .cms-saved.is-dirty::before { background: var(--amber); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Filament-style icon button — subtle, rounded, ring-based */
    .cms-icon-btn {
      width: 36px; height: 36px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s;
      position: relative;
    }
    .cms-icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .cms-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring-focus); }
    .cms-icon-btn svg { width: 16px; height: 16px; }
    .cms-icon-btn kbd {
      position: absolute; top: -6px; right: -6px;
      font-family: var(--font-mono); font-size: 8.5px;
      background: var(--text); color: #fff;
      border-radius: 3px; padding: 1px 4px;
      opacity: 0;
      transition: opacity .15s;
    }
    .cms-icon-btn:hover kbd { opacity: 1; }

    /* Filament secondary button — white, subtle border, hover tint */
    .cms-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s;
      line-height: 1.25;
    }
    .cms-btn:hover { background: var(--surface-2); }
    .cms-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring-focus); }
    .cms-btn svg { width: 14px; height: 14px; }
    /* Filament primary button — solid fill, no gradient, subtle shadow */
    .cms-btn--primary {
      background: var(--red-warm);
      border-color: var(--red-warm);
      color: #fff;
      box-shadow: 0 1px 2px rgba(220, 38, 38, 0.10);
    }
    .cms-btn--primary:hover { background: var(--red); border-color: var(--red); }
    .cms-btn--primary:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring-focus); }
    .cms-btn--danger {
      background: var(--red-warm);
      border-color: var(--red-warm);
      color: #fff;
    }
    .cms-btn--danger:hover { background: var(--red); }
    .cms-btn kbd {
      font-family: var(--font-mono); font-size: 10px;
      background: rgba(255,255,255,0.20);
      border-radius: 3px; padding: 1px 4px;
      margin-left: 4px;
    }
    .cms-topbar-divider { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

    /* ═══ SIDEBAR (Filament — narrow, white, brand-only header) ═══ */
    .cms-sidebar {
      grid-area: sidebar;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    /* Filament brand row — small icon + lowercase brand text */
    .cms-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 20px;
      height: 64px;
      background: var(--surface);
    }
    .cms-brand img { width: 26px; height: 26px; }
    .cms-brand-name {
      font-family: var(--font-display);
      font-size: 16px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .cms-search {
      padding: 12px 12px 8px;
      position: relative;
    }
    .cms-search input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .cms-search input:focus { background: var(--surface); border-color: var(--red-warm); box-shadow: 0 0 0 3px var(--ring-focus); }
    .cms-search input::placeholder { color: var(--text-mute); }
    .cms-search > svg {
      position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--text-mute);
    }
    .cms-search kbd {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-mute); background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .cms-nav {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px 20px;
    }
    .cms-nav::-webkit-scrollbar { width: 6px; }
    .cms-nav::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    /* Filament sidebar link — compact, subtle red-soft when active */
    .cms-link {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px;
      border-radius: var(--r-md);
      color: var(--text-soft);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
      position: relative;
      margin-top: 1px;
    }
    .cms-link:hover { background: var(--surface-2); color: var(--text); }
    .cms-link.is-active {
      background: var(--red-soft);
      color: var(--red);
    }
    .cms-link svg { width: 16px; height: 16px; color: var(--text-mute); flex-shrink: 0; }
    .cms-link.is-active svg { color: var(--red); }
    .cms-link-label { flex: 1; }

    /* Filament group header — sentence case, muted, small chevron on right */
    .cms-group { margin-top: 14px; }
    .cms-group-head {
      display: flex; align-items: center; gap: 6px;
      width: 100%;
      padding: 4px 10px;
      border-radius: var(--r-md);
      background: none; border: 0;
      color: var(--text-mute);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: color .15s;
    }
    .cms-group-head:hover { color: var(--text-soft); }
    /* Chevron on the RIGHT (Filament pattern) */
    .cms-group-chevron {
      width: 14px; height: 14px;
      color: var(--text-mute);
      transition: transform .2s var(--ease);
      flex-shrink: 0;
      margin-left: auto;
      transform: rotate(90deg);
    }
    .cms-group[aria-expanded="true"] .cms-group-chevron { transform: rotate(-90deg); }
    .cms-group-icon { display: none; }
    .cms-group-title { flex: 1; text-transform: none; letter-spacing: 0; }
    .cms-group-count { display: none; }
    .cms-group-items {
      display: none;
      list-style: none;
      padding: 2px 0 4px 0;
      margin: 0;
    }
    .cms-group[aria-expanded="true"] .cms-group-items { display: block; }

    .cms-subgroup {
      padding: 8px 10px 4px;
      font-size: 11px; font-weight: 600;
      color: var(--text-faint);
    }
    .cms-subgroup:first-child { padding-top: 4px; }

    /* Filament page link — compact, indent icon-sized, red-soft when active */
    .cms-page-link {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px;
      border-radius: var(--r-md);
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .cms-page-link:hover { background: var(--surface-2); color: var(--text); }
    .cms-page-link.is-active {
      background: var(--red-soft);
      color: var(--red);
      font-weight: 500;
    }
    .cms-page-link::before {
      content: '';
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
      transition: background .15s;
    }
    .cms-page-link:hover::before { background: var(--text-mute); }
    .cms-page-link.is-active::before { background: var(--red); }
    .cms-page-link-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cms-page-status {
      display: none;
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0;
    }
    .cms-page-status.is-published { background: var(--green); }
    .cms-page-status.is-draft { background: var(--amber); }

    .cms-divider {
      height: 1px; background: var(--line);
      margin: 12px 10px;
    }

    .cms-user {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
    }
    .cms-user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red-warm), var(--red));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .cms-user-text { flex: 1; min-width: 0; line-height: 1.2; }
    .cms-user-text .n { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .cms-user-text .r { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-mute); }
    .cms-user-arrow { width: 12px; height: 12px; color: var(--text-mute); }

    /* ═══ MAIN ═══ */
    .cms-main {
      grid-area: main;
      background: var(--bg);
      overflow-y: auto;
    }
    .cms-main::-webkit-scrollbar { width: 8px; }
    .cms-main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    /* Filament jump bar — pill tabs, no monospace */
    .cms-jumpbar {
      display: none !important;
      position: sticky; top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 12px 40px;
      display: flex; align-items: center; gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cms-jumpbar::-webkit-scrollbar { display: none; }
    .cms-jumpbar-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-mute);
      flex-shrink: 0;
    }
    .cms-jumpbar-list {
      display: flex; gap: 4px;
      list-style: none;
    }
    .cms-jumpbar-list a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border-radius: var(--r-md);
      color: var(--text-soft);
      font-size: 13px; font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .cms-jumpbar-list a:hover { background: var(--surface); color: var(--text); }
    .cms-jumpbar-list a.is-active {
      background: var(--red-soft);
      color: var(--red);
    }
    .cms-jumpbar-num {
      font-size: 11px; font-weight: 500;
      color: var(--text-faint);
    }
    .cms-jumpbar-list a.is-active .cms-jumpbar-num { color: var(--red); }

    .editor-wrap {
      max-width: 90%;
      margin: 0 auto;
      padding: 32px 40px 96px;
    }

    /* ═══════════════════════════════════════════════════════════════
       Filament Data Table — used by Contact Messages and other inbox-style pages.
       Reference: Filament's Resources table listing.
       ═══════════════════════════════════════════════════════════════ */
    .data-table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .data-table-toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      min-height: 60px;
    }
    .data-table-search {
      position: relative;
      width: 240px;
    }
    .data-table-search svg {
      position: absolute;
      left: 12px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--text-mute); pointer-events: none;
    }
    .data-table-search input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .data-table-search input:focus {
      border-color: var(--red-warm);
      box-shadow: 0 0 0 1px var(--red-warm), 0 0 0 4px var(--ring-focus);
    }
    .data-table-search input::placeholder { color: var(--text-mute); }

    .data-table-columns-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--text-mute);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .data-table-columns-btn:hover { color: var(--text); background: var(--surface-2); }
    .data-table-columns-btn svg { width: 16px; height: 16px; }

    .data-table-scroll { overflow-x: auto; }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--text-soft);
      vertical-align: middle;
    }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:hover { background: var(--surface-3); }

    /* Checkbox column (first column) */
    .data-table-checkbox-cell {
      width: 40px;
      padding-right: 0 !important;
    }
    .data-table-checkbox-cell input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border: 1px solid var(--line-3);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      display: block;
      position: relative;
      transition: background .12s, border-color .12s;
    }
    .data-table-checkbox-cell input[type="checkbox"]:hover { border-color: var(--red-warm); }
    .data-table-checkbox-cell input[type="checkbox"]:checked {
      background: var(--red-warm);
      border-color: var(--red-warm);
    }
    .data-table-checkbox-cell input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 5px; height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Sortable header arrow */
    .data-table-sort {
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer;
      user-select: none;
    }
    .data-table-sort svg { width: 14px; height: 14px; color: var(--text-mute); }

    /* Photo thumbnail (Filament image column) */
    .data-table-photo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-2);
      color: var(--text-mute);
      font-size: 12px; font-weight: 600;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .data-table-photo--placeholder {
      background: var(--surface-2);
      color: var(--text-soft);
    }

    /* Enabled badge — green ring w/ check when on, gray with dash when off */
    .data-table-enabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      color: var(--line-3);
    }
    .data-table-enabled.is-on { color: var(--green); }
    .data-table-enabled svg { width: 20px; height: 20px; }

    /* Toolbar spacer — pushes reorder button to the far left */
    .data-table-toolbar-spacer { flex: 1; }

    /* Page primary action button — top-right of the page-banner (e.g. "New Barrister") */
    .page-primary-action {
      align-self: flex-start;
      flex-shrink: 0;
      padding: 10px 18px;
      font-size: 13.5px;
    }
    .page-primary-action svg { width: 14px; height: 14px; }
    .page-banner .page-primary-action { margin-left: auto; }

    /* Modal record-editor: stack the fields vertically (single-column form inside the modal) */
    .record-editor-fields { display: flex; flex-direction: column; gap: 16px; }
    .record-editor-fields > .field { margin-bottom: 0; }

    /* Read-status circle icon */
    .data-table-read {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border: 1.5px solid var(--red-warm);
      border-radius: 50%;
      color: var(--red-warm);
    }
    .data-table-read.is-read {
      border-color: var(--green);
      color: var(--green);
    }
    .data-table-read svg { width: 12px; height: 12px; }

    /* Row action buttons (View + Edit) */
    .data-table-actions-cell {
      text-align: right;
      white-space: nowrap;
    }
    .data-table-row-actions {
      display: inline-flex;
      gap: 14px;
      justify-content: flex-end;
    }
    .data-table-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      background: transparent;
      border: 0;
      color: var(--text-mute);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s;
    }
    .data-table-action:hover { color: var(--text); }
    .data-table-action svg { width: 14px; height: 14px; }
    .data-table-action--edit { color: var(--red); }
    .data-table-action--edit:hover { color: var(--red-warm); }

    .data-table-empty {
      text-align: center;
      padding: 40px 16px !important;
      color: var(--text-mute);
    }

    /* Footer with count + per-page dropdown */
    .data-table-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      color: var(--text-mute);
      font-size: 13px;
      background: var(--surface);
    }
    .data-table-per-page {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-soft);
      font-size: 13px;
    }
    .data-table-per-page select {
      padding: 4px 24px 4px 10px;
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 14px;
    }
    .data-table-per-page select:focus {
      outline: none;
      border-color: var(--red-warm);
      box-shadow: 0 0 0 3px var(--ring-focus);
    }

    /* Filament per-page save footer — sticky action bar at end of page */
    .page-save-footer {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px;
      margin-top: 32px;
    }
    .page-save-footer .cms-btn--primary {
      min-width: 140px;
      justify-content: center;
    }

    /* Filament breadcrumbs — small gray text with chevron separators */
    .page-breadcrumb {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-mute);
      margin-bottom: 12px;
    }
    .page-breadcrumb a {
      color: var(--text-mute);
      transition: color .15s;
    }
    .page-breadcrumb a:hover { color: var(--text); }
    .page-breadcrumb svg {
      width: 14px; height: 14px;
      color: var(--text-faint);
      flex-shrink: 0;
    }
    .page-breadcrumb [aria-current="page"] {
      color: var(--text);
      font-weight: 500;
    }

    /* Filament page banner — heading row with meta + status pill */
    .page-banner {
      display: flex; align-items: flex-start; gap: 20px;
      margin-bottom: 28px;
    }
    .page-banner-body { flex: 1; min-width: 0; }
    .page-banner h1 {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 600;
      letter-spacing: -0.018em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .page-banner-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-mute);
      margin-top: 10px;
    }
    .page-banner-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
    .page-banner-meta a { color: var(--text-soft); border-bottom: 1px solid var(--line-2); }
    .page-banner-meta a:hover { color: var(--red); border-color: var(--red); }
    .page-banner-meta strong { color: var(--text); font-weight: 600; }
    /* Filament status badge — pill, small caps */
    .page-banner-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }
    .page-banner-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    }
    .page-banner-status.is-draft {
      background: var(--amber-soft);
      color: var(--amber);
    }
    .page-banner-status.is-draft::before { background: var(--amber); }

    /* Filament section block — clean title + description, no icon tile */
    .section-block { margin-top: 48px; scroll-margin-top: 80px; }
    .section-block:first-of-type { margin-top: 20px; }
    .section-block-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 0 4px 14px;
      margin-bottom: 12px;
    }
    /* Icon tile hidden by default — Filament headers are text-only */
    .section-block-icon { display: none; }
    .section-block-meta { flex: 1; min-width: 0; }
    .section-block-title {
      font-family: var(--font-display);
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.008em;
      color: var(--text);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      line-height: 1.4;
    }
    .section-block-anchor {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 500;
      color: var(--text-mute);
      background: var(--surface-2);
      border-radius: 6px;
      padding: 1px 6px;
    }
    .section-block-note {
      font-size: 13px;
      color: var(--text-mute);
      margin-top: 4px;
      line-height: 1.5;
    }
    .section-block-actions { display: flex; gap: 4px; margin-top: 2px; }
    .icon-ghost {
      width: 32px; height: 32px;
      border-radius: var(--r-md);
      border: 0; background: transparent;
      color: var(--text-mute);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .icon-ghost:hover { background: var(--surface-2); color: var(--text); }
    .icon-ghost svg { width: 15px; height: 15px; }

    /* Filament card — rounded-xl with subtle ring instead of shadow */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 12px;
      transition: box-shadow .2s;
    }
    .card:focus-within { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring-focus); }
    /* Filament card title — no monospace/uppercase, just clean subheading */
    .card-title {
      font-size: 15px; font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      letter-spacing: -0.005em;
    }
    .card-title-icon {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      color: var(--text-mute);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-title-icon svg { width: 14px; height: 14px; }
    .card-title-text { flex: 1; }
    .card-title-hint {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-mute);
    }

    /* Filament form field — labels above, taller inputs, softer focus ring */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .field-row .field { margin-bottom: 0; }
    .field-label {
      font-size: 13px; font-weight: 500;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .field-label .req { color: var(--red-warm); font-weight: 500; }
    .field-label .badge {
      font-size: 10.5px; font-weight: 500;
      color: var(--text-mute);
      background: var(--surface-2);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .field-help {
      font-size: 12.5px;
      color: var(--text-mute);
      margin-top: 2px;
      line-height: 1.45;
    }
    /* Filament TextInput / Textarea — 40px tall, gray-300 border, primary focus ring */
    .field-input, .field-textarea, .field-select {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 38px;
    }
    .field-input::placeholder, .field-textarea::placeholder { color: var(--text-faint); }
    .field-input:hover, .field-textarea:hover, .field-select:hover { border-color: var(--line-3); }
    .field-input:focus, .field-textarea:focus, .field-select:focus {
      border-color: var(--red-warm);
      box-shadow: 0 0 0 1px var(--red-warm), 0 0 0 4px var(--ring-focus);
    }
    .field-textarea { resize: vertical; min-height: 62px; line-height: 1.55; padding: 10px 12px; }
    .field-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Filament TextInput with icon (prefix / suffix icon) */
    .field-with-icon { position: relative; }
    .field-with-icon .field-input { padding-left: 38px; }
    .field-with-icon > svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-mute); pointer-events: none;
    }
    /* Prefix/suffix inline label pattern (like Filament's `->prefix()`) */
    .field-affix {
      display: flex; align-items: stretch;
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      background: var(--surface);
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-affix:focus-within { border-color: var(--red-warm); box-shadow: 0 0 0 1px var(--red-warm), 0 0 0 4px var(--ring-focus); }
    .field-affix .field-input { border: 0; box-shadow: none; border-radius: 0; }
    .field-affix .field-input:focus { box-shadow: none; }
    .field-affix-label {
      display: inline-flex; align-items: center;
      padding: 0 12px;
      background: var(--surface-2);
      color: var(--text-mute);
      font-size: 13px;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    .field-affix-label--right { border-right: 0; border-left: 1px solid var(--line); }

    /* Filament character counter — right-aligned below input */
    .field-counter {
      display: flex; justify-content: flex-end; align-items: center;
      font-size: 11.5px;
      color: var(--text-mute);
      margin-top: 4px;
    }
    .field-counter span:first-child { display: none; }
    .field-counter .ok { color: var(--text-mute); }
    .field-counter .warn { color: var(--amber); }

    /* ═══ Filament RichEditor ═══
       Container with a toolbar row above the editable area, all wrapped in a single border. */
    .field-rich {
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-rich:hover { border-color: var(--line-3); }
    .field-rich:focus-within {
      border-color: var(--red-warm);
      box-shadow: 0 0 0 1px var(--red-warm), 0 0 0 4px var(--ring-focus);
    }
    .field-rich-toolbar {
      display: flex; align-items: center; gap: 2px;
      padding: 6px 8px;
      background: var(--surface-3);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .field-rich-tool {
      width: 30px; height: 30px;
      border-radius: var(--r-sm);
      border: 0; background: transparent;
      color: var(--text-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .field-rich-tool:hover { background: var(--surface); color: var(--text); }
    .field-rich-tool.is-active { background: var(--red-soft); color: var(--red); }
    .field-rich-tool svg { width: 15px; height: 15px; }
    .field-rich-divider {
      width: 1px; height: 18px;
      background: var(--line);
      margin: 0 4px;
    }
    .field-rich .field-textarea {
      border: 0;
      border-radius: 0;
      background: var(--surface);
      min-height: 140px;
    }
    .field-rich .field-textarea:focus { box-shadow: none; border-color: transparent; }

    /* ═══ Filament FileUpload — dashed drop zone (empty) or file card (filled) ═══ */
    .media-drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      padding: 32px 20px;
      background: var(--surface);
      border: 2px dashed var(--line-2);
      border-radius: var(--r-md);
      text-align: center;
      transition: border-color .15s, background .15s;
      cursor: pointer;
    }
    .media-drop:hover, .media-drop.is-dragover {
      border-color: var(--red-warm);
      background: var(--red-soft);
    }
    .media-drop-icon {
      width: 40px; height: 40px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-mute);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .media-drop-icon svg { width: 20px; height: 20px; }
    .media-drop-title {
      font-size: 13.5px; font-weight: 500;
      color: var(--text);
    }
    .media-drop-title a { color: var(--red); font-weight: 600; }
    .media-drop-hint {
      font-size: 12px;
      color: var(--text-mute);
    }

    /* Filament FileUpload — filled card (existing file) */
    .media-slot {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      transition: border-color .15s;
    }
    .media-slot:hover { border-color: var(--line-2); }
    .media-slot-thumb {
      width: 56px; height: 56px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      color: var(--text-mute);
    }
    .media-slot-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .media-slot-thumb svg { width: 22px; height: 22px; }
    .media-slot-body { flex: 1; min-width: 0; }
    .media-slot-body .n { font-size: 13.5px; font-weight: 500; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-slot-body .m { font-size: 12px; color: var(--text-mute); }
    .media-slot-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* Compact variants for use inside repeater cards (tight layout) */
    .media-drop--compact {
      padding: 18px 12px;
      gap: 2px;
    }
    .media-drop--compact .media-drop-icon {
      width: 32px; height: 32px;
      margin-bottom: 4px;
    }
    .media-drop--compact .media-drop-icon svg { width: 16px; height: 16px; }
    .media-drop--compact .media-drop-title { font-size: 12.5px; }
    .media-drop--compact .media-drop-hint { font-size: 11px; }

    .media-slot--compact {
      padding: 8px 10px;
      gap: 10px;
    }
    .media-slot--compact .media-slot-thumb { width: 40px; height: 40px; }
    .media-slot--compact .media-slot-thumb svg { width: 18px; height: 18px; }
    .media-slot--compact .media-slot-body .n { font-size: 13px; }
    .media-slot--compact .media-slot-body .m { font-size: 11.5px; }
    .media-slot--compact .cms-btn { padding: 4px 10px; font-size: 12px; }

    /* ═══ Filament Repeater — inline expanded cards ═══
       Reference: https://filamentphp.com/docs/3.x/forms/fields/repeater
       Each item is a card that renders its schema fields directly inside — no popup edit. */
    .repeater { display: flex; flex-direction: column; gap: 10px; }
    .repeater.is-inline .repeater-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 12px 16px 16px;
      display: block;
      transition: border-color .15s;
    }
    .repeater.is-inline .repeater-item:hover { border-color: var(--line-2); }
    .repeater.is-inline .repeater-item.is-drop-target { border-color: var(--red-warm); background: var(--red-soft); }

    /* Card header row: reorder arrows left, trash icon right */
    .repeater-item-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .repeater-item-reorder,
    .repeater-item-remove {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      border: 0; background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .repeater-item-reorder { color: var(--text-mute); cursor: grab; }
    .repeater-item-reorder:hover { background: var(--surface-2); color: var(--text); }
    .repeater-item-reorder:active { cursor: grabbing; }
    .repeater-item-reorder svg { width: 16px; height: 16px; }

    .repeater-item-remove { color: var(--red-warm); }
    .repeater-item-remove:hover { background: var(--red-soft); color: var(--red); }
    .repeater-item-remove svg { width: 16px; height: 16px; }

    /* Fields inside the card — 2-column grid by default; textareas span both */
    .repeater-item-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .repeater-item-fields > .field { margin-bottom: 0; }
    .repeater-item-fields > .field.is-full { grid-column: 1 / -1; }
    @media (max-width: 700px) {
      .repeater-item-fields { grid-template-columns: 1fr; }
    }

    /* Filament "Add" button — centered pill below the list */
    .repeater-add-wrap {
      display: flex; justify-content: center;
      margin-top: 4px;
    }
    .repeater-add-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
    }
    .repeater-add-btn:hover {
      background: var(--surface-2);
      border-color: var(--line-3);
    }
    .repeater-add-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring-focus);
    }
    .repeater-add-btn svg { width: 14px; height: 14px; }

    /* Empty state placeholder */
    .empty-hint {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-mute);
      font-size: 13px;
      background: var(--surface-3);
      border: 1px dashed var(--line);
      border-radius: var(--r-md);
    }
    .empty-hint svg { width: 32px; height: 32px; margin-bottom: 10px; opacity: 0.5; }

    /* Toasts — stack in bottom-right */
    .cms-toasts {
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 200;
      display: flex; flex-direction: column; gap: 10px;
      max-width: 400px;
      pointer-events: none;
    }
    /* Filament toast — rounded, ring-based border, colored left accent */
    .cms-toast {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: var(--r-md);
      padding: 14px 40px 14px 14px;
      box-shadow: var(--shadow-lg);
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 13px;
      pointer-events: auto;
      opacity: 0;
      transform: translateX(120%);
      transition: transform .35s var(--ease), opacity .25s;
      position: relative;
    }
    .cms-toast.show { opacity: 1; transform: translateX(0); }
    .cms-toast--error   { border-left-color: var(--red-warm); }
    .cms-toast--warn    { border-left-color: var(--amber); }
    .cms-toast--info    { border-left-color: var(--blue); }
    .cms-toast-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .cms-toast--error   .cms-toast-icon { background: var(--red-warm); }
    .cms-toast--warn    .cms-toast-icon { background: var(--amber); }
    .cms-toast--info    .cms-toast-icon { background: var(--blue); }
    .cms-toast-icon svg { width: 12px; height: 12px; }
    .cms-toast-body { flex: 1; min-width: 0; }
    .cms-toast-title { font-weight: 600; margin-bottom: 2px; }
    .cms-toast-desc  { color: var(--text-mute); font-size: 12.5px; line-height: 1.45; }
    .cms-toast-close {
      position: absolute; top: 8px; right: 8px;
      width: 22px; height: 22px; border-radius: 4px;
      border: 0; background: transparent; color: var(--text-mute);
      cursor: pointer;
    }
    .cms-toast-close:hover { background: var(--surface-2); color: var(--text); }
    .cms-toast-close svg { width: 12px; height: 12px; }

    /* Filament modal — rounded-2xl, larger shadow, smooth entry */
    .cms-modal-backdrop {
      position: fixed; inset: 0;
      z-index: 150;
      background: rgba(17, 24, 39, 0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .cms-modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .cms-modal {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      max-width: 480px; width: 100%;
      transform: translateY(20px) scale(0.98);
      transition: transform .25s var(--ease);
    }
    .cms-modal-backdrop.show .cms-modal { transform: translateY(0) scale(1); }
    .cms-modal-head {
      padding: 24px 24px 12px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .cms-modal-icon {
      width: 40px; height: 40px; border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cms-modal-icon.is-danger  { background: var(--red-soft); color: var(--red); }
    .cms-modal-icon.is-warn    { background: var(--amber-soft); color: var(--amber); }
    .cms-modal-icon.is-info    { background: var(--blue-soft); color: var(--blue); }
    .cms-modal-icon.is-success { background: var(--green-soft); color: var(--green); }
    .cms-modal-icon svg { width: 20px; height: 20px; }
    .cms-modal-title {
      font-family: var(--font-display);
      font-size: 16px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .cms-modal-body {
      padding: 0 24px 20px 78px;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.55;
    }
    .cms-modal-body strong { color: var(--text); font-weight: 600; }
    .cms-modal-body ul { margin: 10px 0 0 18px; }
    .cms-modal-body li { margin-top: 4px; }
    .cms-modal-actions {
      padding: 14px 24px;
      background: var(--surface-3);
      border-top: 1px solid var(--line);
      border-radius: 0 0 var(--r-xl) var(--r-xl);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .cms-btn:disabled, .cms-btn[disabled] { opacity: 0.55; cursor: not-allowed; pointer-events: none; }

    /* Save/publish button loading state */
    .cms-btn.is-loading {
      color: transparent !important;
      pointer-events: none;
    }
    .cms-btn.is-loading::after {
      content: ''; position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      transform: translate(-50%, -50%);
      animation: spin .7s linear infinite;
    }
    .cms-btn { position: relative; }
    .cms-btn.is-loading:not(.cms-btn--primary):not(.cms-btn--danger)::after {
      border-color: rgba(17, 24, 39, 0.15);
      border-top-color: var(--text);
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Form validation */
    .field.is-invalid .field-input,
    .field.is-invalid .field-textarea,
    .field.is-invalid .field-select {
      border-color: var(--red-warm);
      background: rgba(220, 38, 38, 0.03);
    }
    .field.is-invalid .field-input:focus,
    .field.is-invalid .field-textarea:focus,
    .field.is-invalid .field-select:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    .field-error {
      display: none;
      font-size: 12px;
      color: var(--red-warm);
      margin-top: 2px;
      align-items: center;
      gap: 6px;
    }
    .field-error svg { width: 12px; height: 12px; }
    .field.is-invalid .field-error { display: flex; }

    /* Filament empty state */
    .empty-state {
      padding: 40px 24px;
      background: var(--surface-3);
      border: 1px dashed var(--line-2);
      border-radius: var(--r-md);
      text-align: center;
      color: var(--text-mute);
    }
    .empty-state-icon {
      width: 44px; height: 44px; border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-mute);
      margin-bottom: 14px;
    }
    .empty-state-icon svg { width: 20px; height: 20px; }
    .empty-state-title {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .empty-state-desc {
      font-size: 12.5px;
      color: var(--text-mute);
      max-width: 340px;
      margin: 0 auto 14px;
      line-height: 1.55;
    }

    /* Media upload states */
    .media-slot.is-uploading .media-slot-thumb {
      position: relative;
    }
    .media-slot.is-uploading .media-slot-thumb::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.85);
      z-index: 1;
      border-radius: inherit;
    }
    .media-slot.is-uploading .media-slot-thumb::after {
      content: ''; position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(17, 24, 39, 0.15);
      border-top-color: var(--red-warm);
      transform: translate(-50%, -50%);
      animation: spin .7s linear infinite;
      z-index: 2;
    }
    .media-progress {
      height: 3px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .media-progress-bar {
      height: 100%;
      background: var(--red-warm);
      width: 0;
      transition: width .1s linear;
    }

    /* Status pill in banner — Draft/Published toggle */
    .page-banner-status { cursor: default; }
    .page-banner-status.is-dirty {
      background: var(--amber-soft);
      border-color: rgba(217, 119, 6, 0.25);
      color: var(--amber);
    }
    .page-banner-status.is-dirty::before { background: var(--amber); }

    /* Filament section-edit modal — large, scrollable */
    .cms-modal.is-section-edit {
      max-width: 780px;
      max-height: 88vh;
      display: flex; flex-direction: column;
    }
    .cms-modal.is-section-edit .cms-modal-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
    }
    .cms-modal.is-section-edit .cms-modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      color: var(--text);
      background: var(--bg);
    }
    .cms-modal.is-section-edit .cms-modal-actions {
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-radius: 0 0 var(--r-xl) var(--r-xl);
    }
    .cms-modal.is-section-edit .cms-modal-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-mute);
      margin-bottom: 4px;
    }
    /* Cards inside the section-edit modal stay clean-white */
    .cms-modal.is-section-edit .card {
      border: 1px solid var(--line);
      margin-bottom: 14px;
      background: var(--surface);
    }
    .cms-modal.is-section-edit .card:last-child { margin-bottom: 0; }

    /* Responsive */
    @media (max-width: 1000px) {
      :root { --sidebar-w: 248px; }
      .editor-wrap { padding: 24px 24px 60px; }
      .cms-jumpbar { padding: 12px 24px; }
    }
    @media (max-width: 680px) {
      .cms { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
      .cms-sidebar { display: none; }
      .field-row, .field-inline { grid-template-columns: 1fr; }
      .cms-topbar { padding: 0 16px; }
      .cms-topbar-eyebrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="cms">

    <!-- ═══ SIDEBAR (Filament-style — narrow, brand only, no search) ═══ -->

    <!-- ═══ MAIN ═══ -->
    <main class="cms-main">
      <div class="cms-jumpbar" id="jumpbar"><!-- populated --></div>
      <div class="editor-wrap" id="editor"><!-- populated --></div>
    </main>
  </div>

  <!-- Toast container (stack) -->
  <div class="cms-toasts" id="cmsToasts"></div>

  <!-- Section Edit Modal — dedicated large modal that opens when user clicks "Edit" on a section -->
  <div class="cms-modal-backdrop" id="sectionEditModal">
    <div class="cms-modal is-section-edit" role="dialog" aria-modal="true" aria-labelledby="sectionEditTitle">
      <div class="cms-modal-head">
        <div class="cms-modal-icon is-info" id="sectionEditIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="cms-modal-eyebrow" id="sectionEditEyebrow">Editing section</div>

        </div>
        <button class="icon-ghost" onclick="closeSectionEdit()" style="margin-left:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="cms-modal-body" id="sectionEditBody"><!-- fields injected --></div>
      <div class="cms-modal-actions">
        <button class="cms-btn" onclick="closeSectionEdit()">Cancel</button>
        <button class="cms-btn cms-btn--primary" id="sectionEditSave" onclick="saveSectionEdit()">Save changes</button>
      </div>
    </div>
  </div>

  <!-- Confirmation modal (delete / publish / unsaved) -->
  <div class="cms-modal-backdrop" id="cmsModal">
    <div class="cms-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="cms-modal-head">
        <div class="cms-modal-icon is-danger" id="modalIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div style="flex:1;min-width:0;">

  <script>
    /* ═══════════════════════════════════════════════════════════════

    const ICON = {

      map:      '<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>',
      clock:    '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',

    const svg = (key, w=14) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="${w}" height="${w}">${ICON[key] || ''}</svg>`;

    /* ═══════════════════════════════════════════════════════════════

       ═══════════════════════════════════════════════════════════════ */
    const NAV = [
      { type: 'link', id: 'home', label: 'Home Page', icon: 'home', status: 'published' },
      { type: 'group', label: 'Practice Areas', icon: 'briefcase', open: true, children: [
        { type: 'sub', label: 'Criminal Law' },
        { type: 'page', id: 'assault',          label: 'Assault Offences',           status: 'published' },
        { type: 'page', id: 'domestic',         label: 'Domestic Violence & AVOs',   status: 'published' },

        { type: 'page', id: 'sexual',           label: 'Sexual Offences',            status: 'published' },
        { type: 'page', id: 'court-outcomes',   label: 'Court Outcomes',             status: 'published' },
        { type: 'page', id: 'bail',             label: 'Bail Applications',          status: 'published' },
        { type: 'sub', label: 'Traffic Law' },
        { type: 'page', id: 'licence',          label: 'Licence Appeals',            status: 'published' },
        { type: 'page', id: 'drink',            label: 'Drink Driving',              status: 'published' },
        { type: 'page', id: 'drug-driving',     label: 'Drug Driving',               status: 'published' },
        { type: 'page', id: 'serious-traffic',  label: 'Serious Traffic Matters',    status: 'published' }
      ]},
      { type: 'group', label: 'Results', icon: 'check', open: false, children: [
        { type: 'page', id: 'recent-cases', label: 'Recent Cases', status: 'published' }
      ]},
      { type: 'group', label: 'About Us', icon: 'info', open: false, children: [
        { type: 'page', id: 'chadi',      label: 'Meet Chadi Irani',           status: 'published' },
        { type: 'page', id: 'barristers', label: 'Barristers We Instruct',     status: 'published' },
        { type: 'page', id: 'courts',     label: 'Courts We Attend',           status: 'published' },
        { type: 'page', id: 'fees',       label: 'Fees & Costs',               status: 'published' },
        { type: 'page', id: 'faq',        label: 'Frequently Asked Questions', status: 'draft' },
        { type: 'page', id: 'legal-aid',  label: 'Legal Aid NSW',              status: 'published' }
      ]},
      { type: 'link', id: 'contact', label: 'Contact', icon: 'phone', status: 'published' },
      { type: 'link', id: 'contact-messages', label: 'Contact Messages', icon: 'quote' },
      { type: 'divider' },
      { type: 'link', id: 'global', label: 'Global Settings', icon: 'settings' }

                    { t: 'Is touching someone really an assault?',
                      d: 'Yes — if it is intentional, without consent, and without lawful excuse. Ordinary contact in social settings is implicitly consented to. But a deliberate push, grab or shove — even one that causes no injury — is a common assault. So is a raised fist at close range, a spit, or a credible threat of imminent harm.' },

                  items: [
                    { t: 'Can I keep driving while the appeal is pending?',   d: 'Only if the Local Court grants a stay of the suspension. The suspension takes effect on the date specified in the Notice — unless you lodge an appeal and the court orders a stay at the same time. Stays are not automatic and require their own supporting evidence. We apply for the stay at the moment of filing where livelihood is at stake.' },
                    { t: 'What is "exceptional hardship"?',                    d: 'Hardship beyond inconvenience. Mere disruption to your daily routine is not enough. Exceptional hardship usually means a real and substantial impact on your employment, your dependants, your medical treatment or your role as a carer, combined with no realistic alternative arrangement. The bar is genuinely high — preparation is the difference between meeting it and falling short.' },
                    { t: 'What evidence do I need for the appeal?',           d: 'Typically a statutory declaration from you, an employer letter confirming need to drive, character references, a driving record print-out, evidence of any defensive-driving courses completed, and statements from dependants. We prepare and lodge the complete brief on your behalf.' },
                    { t: 'How long does the appeal take to be heard?',        d: "Typically four to eight weeks from filing to hearing, depending on the court's list. Stays can be granted on filing — meaning that for drivers granted a stay, the practical impact of the suspension is deferred for the wait. Urgent applications can be expedited in genuine hardship cases." },
                    { t: 'What happens if I lose the appeal?',                d: "The original suspension stands — and runs from the date of the Magistrate's decision (unless a stay had been operating, in which case the suspension starts then). The court does not generally extend the period as a consequence of an unsuccessful appeal, although it can on serious matters. There is a further right of appeal to the District Court in very limited circumstances." },
                    { t: 'Can I appeal a police on-the-spot suspension?',      d: 'Yes — and quickly. The same 28-day window applies from the moment the licence is taken at the roadside. Because the suspension takes effect immediately, the priority is filing the appeal and a stay application on the same day so the practical impact is paused. Police on-the-spot suspensions are usually for speeding over 45 km/h or for drink driving.' }

                    { t: "What's the difference between negligent and dangerous driving?",              d: 'Negligent driving (s.117 RTA) measures driving against the standard of a reasonable and prudent driver — momentary lapses, distraction, misjudgement. Dangerous driving (s.52A Crimes Act) requires the driving to have been objectively dangerous to others — a much higher threshold, but a much heavier penalty range. The same set of facts can sometimes be charged either way, and that characterisation is often the most important argument in the matter.' },
                    { t: 'Can I get a Section 10 for negligent driving causing GBH?',                   d: "It is harder, but it remains available on the right facts. The Magistrate must be satisfied that a conviction is not warranted given the offender's character, history, the circumstances of the offence and the likelihood of repeat offending. We have secured Section 10 outcomes on injury-causing matters where the negligence was at the lower end and the subjective material was strong." },
                    { t: "I didn't know my licence was suspended — is that a defence?",                  d: 'It can be a complete defence, provided you can demonstrate you had no actual knowledge of the suspension and no reason to suspect it. Documentation matters: proof of address changes, mail-handling arrangements, RMS contact history, and any returned-mail records. The defence is most effective when raised at the first appearance, not after a plea.' },
                    { t: 'Will I go to jail for a dangerous driving charge?',                            d: 'It is a realistic risk on conviction — dangerous driving causing GBH or death almost invariably attracts a custodial sentence. The work on these matters is in establishing the strongest available case for a non-custodial alternative — an Intensive Correction Order (ICO) served in the community under intensive supervision, rather than full-time custody. Mitigation has to be substantial, evidence-based and prepared early.' },
                    { t: 'Will the court take my employment into account?',                              d: 'Yes — but only if you put the evidence in front of the court. Employer letters, descriptions of your duties, the public-transport alternatives available, the impact on dependants, and any hardship to third parties are all relevant to disqualification length and to the case for a Section 10. We help you assemble that material before sentence, not after.' },
                    { t: "I've been declared a Habitual Traffic Offender. Can it be quashed?",           d: 'Yes — on the right grounds. The Local Court can quash an HTO declaration where it is satisfied the additional 5-year disqualification would be disproportionate in all the circumstances. The application is usually run alongside sentencing on the new matter, with supporting evidence of hardship, rehabilitation and the time-pattern of the prior offences.' }
                  ] }]
              }
            ]
          },
          ctaSection('Free 1st consultation — discreet & confidential.', "We're available 24/7 to discuss your matter."),
          seoSection('Serious Traffic Matters — Negligent & Dangerous Driving · Powerhouse Law Australia', 'Defence for the most serious driving charges in NSW — negligent driving, dangerous driving, drive whilst suspended and drive whilst disqualified. Free 1st consultation · 24/7.')
        ]
      },

            'First contact &', 'what to expect.',
            'The questions we hear most often at the very first call — before we even talk about the charge.',
            [
              { t: 'Who is Powerhouse Law and what do you do?',
                d: 'We are a Sydney-based criminal defence and traffic law firm established in 2009. Our Principal Solicitor, Chadi Irani, is an Accredited Specialist in Criminal Law and sits on both the Legal Aid NSW Serious Crime and General Crime panels. We have defended 2,400+ matters across every NSW court — from local mention lists to Supreme Court trials.' },
              { t: 'Is the first consultation really free?',
                d: 'Yes — and there is no obligation to retain us. The first conversation is a chance for you to explain what has happened, for us to give you indicative advice on where you stand, and for both sides to decide whether we are the right fit. You will leave the call with a clear next step — not a bill.' },
              { t: 'Is everything I tell you confidential?',
                d: 'Yes. Legal professional privilege attaches to your communications with us from the moment you contact our firm — including the free first consultation, and including matters where you ultimately decide not to retain us. We do not share information with anyone without your instructions.' },
              { t: "Can you help me if I'm outside Sydney?",
                d: 'Yes. We appear in courts across NSW — Local, District and Supreme — and regularly travel to regional and suburban Local Courts. Initial consultations can be conducted by phone or video link, and we will tell you up front whether travel costs apply.' },
              { t: 'What should I bring to the first meeting?',
                d: 'Bring any paperwork the police have given you — the Court Attendance Notice (CAN), fact sheet, bail papers, infringement notice or licence suspension notice. If you do not have anything in writing yet, bring a clear timeline of what happened, the date of any court appearance, and the contact details of any witnesses.' },

            [
              { t: "I've just been charged. What happens next?",
                d: 'You will be issued a Court Attendance Notice (CAN) with a date for your first appearance — usually in the Local Court. Between now and that date, your lawyer obtains the police brief, advises you on the strength of the prosecution case, and decides with you whether to plead guilty, not guilty, or negotiate the charges. Get legal advice before you enter any plea.' },
              { t: 'What is a "mention" and do I have to attend?',
                d: 'A mention is a brief listing where the court checks on the progress of your matter — for example, whether the brief has been served, or whether you are ready to enter a plea. For most Local Court mentions, your lawyer can appear for you and you do not need to attend. We will always tell you in advance when your attendance is required.' },
              { t: 'How long will my matter take to resolve?',

              { t: 'What is bail and how does it work?',

              { t: 'Bail was refused. Can we apply again?',

              { t: 'Will I get a criminal record?',
