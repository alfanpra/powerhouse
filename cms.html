    let currentId = 'home';

    function renderSidebar() {
      const nav = document.getElementById('cmsNav');
      const parts = NAV.map(item => {
        if (item.type === 'link') {
          return `<a class="cms-link" href="#" data-page-id="${item.id}">
            ${svg(item.icon)}
            <span class="cms-link-label">${item.label}</span>
            ${item.status ? `<span class="cms-page-status is-${item.status}"></span>` : ''}
          </a>`;
        }
        if (item.type === 'group') {
          const children = item.children.map(c => {
            if (c.type === 'sub') return `<li class="cms-subgroup">${c.label}</li>`;
            return `<li><a class="cms-page-link" href="#" data-page-id="${c.id}">
              <span class="cms-page-link-label">${c.label}</span>
              <span class="cms-page-status is-${c.status}"></span>
            </a></li>`;
          }).join('');
          const pageCount = item.children.filter(c => c.type === 'page').length;
          return `<div class="cms-group" aria-expanded="${item.open}">
            <button class="cms-group-head" data-toggle>
              <span class="cms-group-icon">${svg(item.icon)}</span>
              <span class="cms-group-title">${item.label}</span>
              <span class="cms-group-count">${pageCount}</span>
              <svg class="cms-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <ul class="cms-group-items">${children}</ul>
          </div>`;
        }
        if (item.type === 'divider') return `<div class="cms-divider"></div>`;
        return '';
      });
      nav.innerHTML = parts.join('');

      nav.querySelectorAll('.cms-group-head[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const group = btn.closest('.cms-group');
          const open = group.getAttribute('aria-expanded') === 'true';
          group.setAttribute('aria-expanded', String(!open));
        });
      });
      nav.querySelectorAll('[data-page-id]').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          switchPage(link.dataset.pageId);
        });
      });
    }

    function renderField(f) {
      if (f.type === 'row') return `<div class="field-row">${f.fields.map(x => `<div class="field">${renderFieldInner(x)}</div>`).join('')}</div>`;
      return `<div class="field">${renderFieldInner(f)}</div>`;
    }
    function renderFieldInner(f) {
      const req = f.required ? ' data-required="1"' : '';
      const label = f.label ? `<label class="field-label">${f.label} ${f.required ? '<span class="req">*</span>' : ''} ${f.badge ? `<span class="badge">${f.badge}</span>` : ''}</label>` : '';
      const help  = f.help ? `<div class="field-help">${f.help}</div>` : '';
      const counter = f.counter ? `<div class="field-counter"><span></span><span class="${f.counter[0] <= f.counter[1] ? 'ok' : 'warn'}">${f.counter[0]} / ${f.counter[1]}</span></div>` : '';
      const errMsg = f.required ? `<div class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>This field is required</div>` : '';
      switch (f.type) {
        case 'text':
          return `${label}<input class="field-input" type="text" placeholder="${escapeAttr(f.placeholder || '')}" value="${escapeAttr(f.value || '')}"${req} />${errMsg}${help}${counter}`;
        case 'textarea': {
          const rows = f.rows || 3;
          const usesRich = f.rich !== false && (f.rich === true || rows >= 3);
          const textareaHtml = `<textarea class="field-textarea" rows="${rows}" placeholder="${escapeAttr(f.placeholder || '')}"${req}>${escapeHtml(f.value || '')}</textarea>`;
          if (!usesRich) return `${label}${textareaHtml}${errMsg}${help}${counter}`;
          // Filament RichEditor — cosmetic toolbar above the textarea. Each tool is a static heroicon-style button.
          const richToolIcon = {
            bold:   '<path d="M6 4h6a4 4 0 0 1 3 6.7A4.5 4.5 0 0 1 13 20H6z" fill="currentColor"/><path d="M6 12h7" stroke="#fff" stroke-width="1.4"/>',
            italic: '<line x1="19" y1="4" x2="10" y2="4" stroke-width="1.8"/><line x1="14" y1="20" x2="5" y2="20" stroke-width="1.8"/><line x1="15" y1="4" x2="9" y2="20" stroke-width="1.8"/>',
            underline: '<path d="M6 4v8a6 6 0 0 0 12 0V4" stroke-width="1.8"/><line x1="4" y1="21" x2="20" y2="21" stroke-width="1.8"/>',
            strike: '<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6" stroke-width="1.8"/><line x1="4" y1="12" x2="20" y2="12" stroke-width="1.8"/>',
            link:   '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-width="1.8"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-width="1.8"/>',
            ul:     '<line x1="8" y1="6" x2="21" y2="6" stroke-width="1.8"/><line x1="8" y1="12" x2="21" y2="12" stroke-width="1.8"/><line x1="8" y1="18" x2="21" y2="18" stroke-width="1.8"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/>',
            ol:     '<line x1="10" y1="6" x2="21" y2="6" stroke-width="1.8"/><line x1="10" y1="12" x2="21" y2="12" stroke-width="1.8"/><line x1="10" y1="18" x2="21" y2="18" stroke-width="1.8"/><path d="M4 6h1v4M4 12l2 0v1l-2 1v1h2M5 15v1M4 17h2v2H4z" stroke-width="1.4" fill="none"/>',
            quote:  '<path d="M3 21c3-3 6-5 9-6-2-1-3-3-3-6a6 6 0 0 1 12 0c0 4-3 7-8 12" stroke-width="1.8"/>',
            code:   '<polyline points="16 18 22 12 16 6" stroke-width="1.8"/><polyline points="8 6 2 12 8 18" stroke-width="1.8"/>',
            h2:     '<path d="M4 6v12M12 6v12M4 12h8" stroke-width="1.8"/><path d="M17 10c0-1 1-2 2.5-2s2.5 1 2.5 2c0 2-5 4-5 6h5" stroke-width="1.6"/>',
            h3:     '<path d="M4 6v12M12 6v12M4 12h8" stroke-width="1.8"/><path d="M17 8h5l-3 4c2 0 3 1 3 3s-1.3 3-3 3h-2" stroke-width="1.6"/>',
            undo:   '<path d="M3 7v6h6" stroke-width="1.8"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13" stroke-width="1.8"/>',
            redo:   '<path d="M21 7v6h-6" stroke-width="1.8"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13" stroke-width="1.8"/>'
          };
          const tool = (k, title) => `<button type="button" class="field-rich-tool" title="${title}" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${richToolIcon[k]}</svg></button>`;
          const divider = `<span class="field-rich-divider"></span>`;
          return `${label}<div class="field-rich">
            <div class="field-rich-toolbar" role="toolbar" aria-label="Formatting">
              ${tool('bold','Bold')}${tool('italic','Italic')}${tool('underline','Underline')}${tool('strike','Strikethrough')}
              ${divider}${tool('link','Link')}
              ${divider}${tool('ul','Bullet list')}${tool('ol','Ordered list')}${tool('quote','Blockquote')}${tool('code','Code block')}
              ${divider}${tool('h2','Heading 2')}${tool('h3','Heading 3')}
              ${divider}${tool('undo','Undo')}${tool('redo','Redo')}
            </div>
            ${textareaHtml}
          </div>${errMsg}${help}${counter}`;
        }
        case 'cta':
          return `${label}<div class="field-inline">
            <input class="field-input" type="text" value="${escapeAttr(f.labelValue)}" placeholder="Label" />
            <div class="field-with-icon">${svg(f.linkIcon || 'text')}<input class="field-input" type="text" value="${escapeAttr(f.linkValue)}" placeholder="Link" /></div>
          </div>`;
        case 'media': {
          // Filament FileUpload — empty state uses a dashed drop-zone; filled state uses a file card
          if (f.placeholder) {
            return `${label}<div class="media-drop" role="button" tabindex="0" onclick="onReplaceMedia(this)">
              <div class="media-drop-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </div>
              <div class="media-drop-title">Drag &amp; drop your files or <a>Browse</a></div>
              <div class="media-drop-hint">${f.name || 'PNG, JPG, SVG up to 5 MB'}${f.meta ? ' · ' + f.meta : ''}</div>
            </div>${errMsg}${help}`;
          }
          const thumbInner = f.src
            ? `<img src="${f.src}" alt="" onerror="this.style.display='none'" />`
            : svg('image', 22);
          return `${label}<div class="media-slot">
            <div class="media-slot-thumb" ${f.bg ? `style="background:${f.bg};padding:6px;"` : ''}>${thumbInner}</div>
            <div class="media-slot-body">
              <div class="n">${f.name}</div>
              <div class="m">${f.meta}</div>
              <div class="media-progress" style="display:none;"><div class="media-progress-bar"></div></div>
            </div>
            <div class="media-slot-actions">
              <button class="cms-btn" onclick="onReplaceMedia(this)">Replace</button>
              <button class="icon-ghost" title="Remove" onclick="onRemoveMedia(this, '${escapeAttr(f.name)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </div>
          </div>`;
        }
        case 'repeater': {
          const repId = 'rep-' + (++__repIdCounter);
          const schema = f.itemSchema || DEFAULT_ITEM_SCHEMA;
          REPEATER_REGISTRY[repId] = {
            items: f.items || [],
            schema,
            itemLabel: f.itemLabel || (f.addLabel ? f.addLabel.replace(/^Add\s+/i, '') : 'Item'),
            addLabel: f.addLabel || 'Add item',
            emptyHint: f.emptyHint || "Nothing here to show — add your first item to get started."
          };
          return `${label}<div class="repeater is-inline" data-rep-id="${repId}">${renderRepeaterBody(repId)}</div>`;
        }
      }
      return '';
    }

    function renderCard(c) {
      return `<div class="card">
        <div class="card-title">
          <span class="card-title-icon">${svg(c.icon || 'text', 12)}</span>
          <span class="card-title-text">${c.title}</span>
          ${c.hint ? `<span class="card-title-hint">${c.hint}</span>` : ''}
        </div>
        ${c.fields.map(renderField).join('')}
      </div>`;
    }

    function renderSection(s) {
      return `<div class="section-block" id="s-${s.id}" data-section-id="${s.id}">
        <div class="section-block-head">
          <div class="section-block-icon">${svg(s.icon || 'text', 17)}</div>
          <div class="section-block-meta">
            <div class="section-block-title">${s.title} ${s.anchor || s.id ? `<span class="section-block-anchor">#${s.anchor || s.id}</span>` : ''}</div>
            <div class="section-block-note">${s.note || ''}</div>
          </div>
          <div class="section-block-actions">
            
            <button class="icon-ghost" title="Preview on the live site" onclick="onPreviewSection('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        ${s.cards.map(renderCard).join('')}
      </div>`;
    }

    let dirty = false; // page has unsaved edits

    /* ═══════════════════════════════════════════════════════════════
       Filament-style data table (used by Contact Messages inbox etc.)
       ═══════════════════════════════════════════════════════════════ */
    function renderTablePage(p) {
      const t = p.table || { columns: [], rows: [] };
      const cols = t.columns || [];
      const rows = t.rows || [];

      const chevronDown = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

      const headerCells = cols.map(c => {
        const alignStyle = c.align === 'right' ? ' style="text-align:right;"' : '';
        if (c.sortable) {
          const arrow = c.sortedDesc ? chevronDown : (c.sortedAsc ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>' : chevronDown);
          return `<th${alignStyle}><span class="data-table-sort">${escapeHtml(c.label)} ${arrow}</span></th>`;
        }
        return `<th${alignStyle}>${escapeHtml(c.label)}</th>`;
      }).join('');

      const rowActions = Array.isArray(t.rowActions) && t.rowActions.length ? t.rowActions : ['view', 'edit'];
      const rowHtml = rows.map((r, i) => {
        const cells = cols.map(c => {
          const value = r[c.key];
          let content = '';
          if (c.render === 'read-status') {
            const isRead = !!value;
            const iconPath = isRead
              ? '<path d="M20 6L9 17l-5-5"/>'
              : '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
            content = `<span class="data-table-read${isRead ? ' is-read' : ''}" title="${isRead ? 'Read' : 'Unread'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${iconPath}</svg>
            </span>`;
          } else if (c.render === 'enabled') {
            // Green check circle for true, muted gray dash-circle for false
            const on = !!value;
            content = `<span class="data-table-enabled${on ? ' is-on' : ''}" title="${on ? 'Enabled' : 'Disabled'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/>${on ? '<path d="M8 12l3 3 5-6" stroke-width="2.4"/>' : '<line x1="8" y1="12" x2="16" y2="12"/>'}</svg>
            </span>`;
          } else if (c.render === 'photo') {
            // Small image thumbnail — supports blob:, data:, http(s), asset paths, or falls back to initials avatar
            const s = String(value || '').trim();
            const isImage = /^(blob:|data:|https?:|\/|assets\/)/.test(s) || /\.(png|jpe?g|svg|webp|gif)$/i.test(s);
            if (isImage) {
              content = `<img class="data-table-photo" src="${escapeAttr(s)}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('<span class=&quot;data-table-photo data-table-photo--placeholder&quot;>${escapeAttr((r.name || r.t || '').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>').firstChild)" />`;
            } else {
              const initials = (r.name || r.t || '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '—';
              content = `<span class="data-table-photo data-table-photo--placeholder">${escapeHtml(initials)}</span>`;
            }
          } else {
            content = escapeHtml(value != null ? String(value) : '—');
          }
          const alignStyle = c.align === 'right' ? ' style="text-align:right;"' : '';
          return `<td${alignStyle}>${content}</td>`;
        }).join('');
        // Row actions — default View + Edit, but a page can opt out of View via t.rowActions
        const actionBtns = rowActions.map(a => {
          if (a === 'view') {
            return `<button class="data-table-action" title="View" onclick="onTableRowView(${i})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              View
            </button>`;
          }
          if (a === 'edit') {
            return `<button class="data-table-action data-table-action--edit" title="Edit" onclick="onTableRowEdit(${i})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
              Edit
            </button>`;
          }
          return '';
        }).join('');
        return `<tr>
          <td class="data-table-checkbox-cell"><input type="checkbox" aria-label="Select row"></td>
          ${cells}
          <td class="data-table-actions-cell">
            <div class="data-table-row-actions">${actionBtns}</div>
          </td>
        </tr>`;
      }).join('');

      const noun = rows.length === 1 ? (t.singular || 'result') : (t.plural || 'results');
      const emptyHtml = `<tr><td colspan="${cols.length + 2}" class="data-table-empty">No ${t.plural || 'records'} yet</td></tr>`;

      const reorderBtn = t.reorderable
        ? `<button class="data-table-columns-btn data-table-reorder-btn" title="Reorder rows" aria-label="Reorder rows">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 7l3-3 3 3"/><path d="M17 20V4M14 17l3 3 3-3"/></svg>
           </button>`
        : '';
      const colToggleBtn = t.showColumnToggle === false ? '' : `<button class="data-table-columns-btn" title="Toggle columns" aria-label="Toggle columns">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="4" width="5" height="16" rx="1"/></svg>
          </button>`;
      return `<div class="data-table-wrap">
        <div class="data-table-toolbar">
          ${reorderBtn}
          <div class="data-table-toolbar-spacer"></div>
          <div class="data-table-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Search" oninput="onTableSearch(this)">
          </div>
          ${colToggleBtn}
        </div>
        <div class="data-table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th class="data-table-checkbox-cell"><input type="checkbox" aria-label="Select all"></th>
                ${headerCells}
                <th class="data-table-actions-cell" aria-label="Row actions"></th>
              </tr>
            </thead>
            <tbody>${rowHtml || emptyHtml}</tbody>
          </table>
        </div>
        <div class="data-table-footer">
          <span class="data-table-count">Showing ${rows.length} ${noun}</span>
          <label class="data-table-per-page">
            Per page
            <select><option>10</option><option>25</option><option>50</option><option>100</option></select>
          </label>
        </div>
      </div>`;
    }

    /* Table row action stubs — mocked toast until wired to a real backend */
    function onTableRowView(idx) {
      const p = PAGES[currentId];
      const row = p?.table?.rows?.[idx];
      if (!row) return;
      openModal({
        icon: 'info',
        title: `Message from ${row.name || 'Unknown'}`,
        body: `<p><strong>Email:</strong> ${escapeHtml(row.email || '—')}</p>
               <p><strong>Phone:</strong> ${escapeHtml(row.phone || '—')}</p>
               <p><strong>Matter type:</strong> ${escapeHtml(row.matter || '—')}</p>
               <p><strong>Received:</strong> ${escapeHtml(row.date || '—')}</p>
               ${row.message ? `<p style="margin-top:12px;">${escapeHtml(row.message)}</p>` : ''}`,
        confirmLabel: 'Close',
        confirmVariant: 'secondary',
        onConfirm: () => closeModal()
      });
    }
    function onTableRowEdit(idx) {
      const p = PAGES[currentId];
      const row = p?.table?.rows?.[idx];
      const editFields = p?.table?.editFields;
      if (!row || !editFields) {
        toast({ type: 'info', title: 'Edit not wired',
                desc: `The edit view for "${row?.name || 'this record'}" would open here.` });
        return;
      }
      openTableRecordEditor(p, idx, false);
    }

    /* Opens the record-editor modal used by both Edit (existing row) and New (empty row) actions on a table page. */
    function openTableRecordEditor(p, idx, isNew) {
      const t = p.table;
      const row = isNew ? {} : t.rows[idx];
      const singular = t.singular || 'record';
      const titleName = singular[0].toUpperCase() + singular.slice(1);

      // Register a synthetic "table-edit" repeater in REPEATER_REGISTRY so the media/text handlers
      // can look up the working record via [data-rep-id][data-idx][data-key] attributes.
      const repId = 'table-edit-' + Date.now();
      REPEATER_REGISTRY[repId] = {
        items: [ isNew ? {} : { ...row } ],   // clone so cancel discards cleanly
        schema: t.editFields,
        itemLabel: titleName,
        addLabel: '',
        emptyHint: ''
      };

      // Build the field HTML using renderRepeaterField so we get the same components
      // (text input, textarea, media-drop, etc.) as the inline repeater cards.
      const fieldsHtml = t.editFields.map(sf => {
        const value = REPEATER_REGISTRY[repId].items[0][sf.key] != null ? REPEATER_REGISTRY[repId].items[0][sf.key] : '';
        return renderRepeaterField(sf, value, repId, 0);
      }).join('');

      document.getElementById('sectionEditEyebrow').textContent = `${p.name} · ${isNew ? 'New' : 'Editing'} ${singular}`;
      document.getElementById('sectionEditTitle').textContent = isNew
        ? `New ${singular}`
        : `${titleName} · ${escapeHtml(row.name || row.t || '')}`;

      document.getElementById('sectionEditBody').innerHTML = `<div class="card">
        <div class="card-title">
          <span class="card-title-icon">${svg('user', 12)}</span>
          <span class="card-title-text">${escapeHtml(titleName)} details</span>
        </div>
        <div class="record-editor-fields">${fieldsHtml}</div>
      </div>`;

      // Track that this modal edit is a table-row edit so saveSectionEdit knows how to commit.
      // The registry only holds ONE working record at index 0, so itemEditContext.idx is 0.
      // The table-row index lives in tableEdit.rowIdx.
      itemEditContext = { repId, idx: 0, tableEdit: { pageId: currentId, rowIdx: idx, isNew } };
      const body = document.getElementById('sectionEditBody');
      body.dataset.dirty = '';
      body.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { body.dataset.dirty = '1'; });
      });
      document.getElementById('sectionEditModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function onNewBarrister() { openTableRecordEditor(PAGES[currentId], null, true); }
    function onTableSearch(input) {
      // Simple client-side filter — hide rows whose visible text doesn't match
      const q = input.value.trim().toLowerCase();
      const rows = input.closest('.data-table-wrap').querySelectorAll('.data-table tbody tr');
      let visible = 0;
      rows.forEach(r => {
        if (r.querySelector('.data-table-empty')) return;
        const text = r.textContent.toLowerCase();
        const show = !q || text.includes(q);
        r.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      const count = input.closest('.data-table-wrap').querySelector('.data-table-count');
      if (count) count.textContent = `Showing ${visible} ${visible === 1 ? 'result' : 'results'}`;
    }

    function renderPage(id) {
      const p = PAGES[id];
      if (!p) return;
      currentId = id;
      dirty = false;

      // Top bar — title now lives in the page banner (Filament breadcrumb pattern), not the topbar
      const topTitle = document.getElementById('topTitle');
      if (topTitle) topTitle.textContent = p.name;
      resetSaveButtons();

      // Jumpbar (skipped for section-less pages like table/inbox views)
      const jumpbar = document.getElementById('jumpbar');
      if (p.sections && p.sections.length) {
        jumpbar.innerHTML = `
          <span class="cms-jumpbar-label">Sections</span>
          <ul class="cms-jumpbar-list">
            ${p.sections.map((s, i) => `<li><a data-jump="s-${s.id}" class="${i===0?'is-active':''}"><span class="cms-jumpbar-num">${String(i+1).padStart(2,'0')}</span> ${s.title.replace(' Section','').replace(' Row','').replace(' List','')}</a></li>`).join('')}
          </ul>`;
        jumpbar.querySelectorAll('[data-jump]').forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            jumpbar.querySelectorAll('[data-jump]').forEach(x => x.classList.remove('is-active'));
            a.classList.add('is-active');
            const t = document.getElementById(a.dataset.jump);
            if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      } else {
        jumpbar.innerHTML = '';
      }

      // Editor body — breadcrumb + page banner + sections + per-page save footer
      const editor = document.getElementById('editor');
      const urlLine = p.url ? `<a href="${p.url}" target="_blank">powerhouselaw.com.au/${p.url}</a><span class="dot"></span>` : '';

      // Find the parent group for this page in NAV so we can render a breadcrumb path
      let parentGroup = null;
      for (const item of NAV) {
        if (item.type === 'group' && item.children) {
          if (item.children.some(c => c.id === id)) { parentGroup = item.label; break; }
        } else if (item.type === 'link' && item.id === id) {
          parentGroup = null; break;
        }
      }
      let crumbs = parentGroup
        ? `<a href="#">CMS</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg><span>${parentGroup}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg><span aria-current="page">${p.name}</span>`
        : `<a href="#">CMS</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg><span aria-current="page">${p.name}</span>`;

      // Filament-style table page (Contact Messages inbox etc.) — breadcrumb is `PageName > List`, no Save footer
      if (p.type === 'table') {
        crumbs = `<a href="#">${escapeHtml(p.name)}</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg><span aria-current="page">List</span>`;
        document.getElementById('jumpbar').innerHTML = '';
        const primaryAction = p.table && p.table.primaryAction
          ? `<button class="cms-btn cms-btn--primary page-primary-action" onclick="${p.table.primaryAction.onClick || 'void 0'}">
               ${p.table.primaryAction.icon !== false ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' : ''}
               ${escapeHtml(p.table.primaryAction.label)}
             </button>`
          : '';
        editor.innerHTML = `
          <nav class="page-breadcrumb" aria-label="Breadcrumb">${crumbs}</nav>
          <div class="page-banner">
            <div class="page-banner-body">
              <h1>${escapeHtml(p.name)}</h1>
            </div>
            ${primaryAction}
          </div>
          ${renderTablePage(p)}
        `;
        return;
      }

      editor.innerHTML = `
        <nav class="page-breadcrumb" aria-label="Breadcrumb">${crumbs}</nav>
        <div class="page-banner">
          <div class="page-banner-body">
            <h1>${p.name}</h1>
            <div class="page-banner-meta">
              ${urlLine}
            </div>
          </div>
        </div>
        ${p.sections.map(renderSection).join('')}
        <div class="page-save-footer">
          <button class="cms-btn" onclick="onDiscardChanges()">Cancel</button>
          <button class="cms-btn cms-btn--primary" id="pageSaveBtn" onclick="onSavePage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Save changes
          </button>
        </div>
      `;

      // Scroll spy for jumpbar
      const sections = editor.querySelectorAll('.section-block[id]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const id = e.target.id;
            jumpbar.querySelectorAll('[data-jump]').forEach(a => {
              a.classList.toggle('is-active', a.dataset.jump === id);
            });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      sections.forEach(s => observer.observe(s));

      // Wire up dirty tracking
      editor.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', markDirty);
        el.addEventListener('change', markDirty);
        el.addEventListener('blur', () => {
          // Re-validate this field on blur
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) {
            wrap.classList.add('is-invalid');
          } else if (wrap) {
            wrap.classList.remove('is-invalid');
          }
        });
      });

      // Scroll main to top on switch
      document.querySelector('.cms-main').scrollTo({ top: 0, behavior: 'instant' });
    }

    function markDirty() {
      if (dirty) return;
      dirty = true;
      const saveBtn = document.getElementById('btnSaveDraft');
      if (saveBtn) saveBtn.classList.add('cms-btn--attn');
      const footerSave = document.getElementById('pageSaveBtn');
      if (footerSave) footerSave.classList.add('cms-btn--attn');
      const saved = document.getElementById('cmsSaved');
      if (saved) { saved.classList.add('is-dirty'); saved.textContent = 'Unsaved changes'; }
    }

    function resetSaveButtons() {
      const s = document.getElementById('btnSaveDraft');
      const p = document.getElementById('btnPublish');
      if (s) { s.classList.remove('is-loading'); s.querySelector('.cms-btn-label').textContent = 'Save Draft'; }
      if (p) { p.classList.remove('is-loading'); p.querySelector('.cms-btn-label').textContent = 'Publish'; }
    }

    function switchPage(id) {
      if (dirty && id !== currentId) {
        openModal({
          icon: 'warn',
          title: 'You have unsaved changes',
          body: `Your changes to <strong>${PAGES[currentId].name}</strong> haven't been saved yet. Leaving this page will discard them.`,
          confirmLabel: 'Discard & switch',
          confirmVariant: 'danger',
          onConfirm: () => {
            closeModal();
            dirty = false;
            actuallySwitchPage(id);
          }
        });
        return;
      }
      actuallySwitchPage(id);
    }
    function actuallySwitchPage(id) {
      document.querySelectorAll('.cms-link, .cms-page-link').forEach(l => l.classList.remove('is-active'));
      document.querySelectorAll(`[data-page-id="${id}"]`).forEach(l => l.classList.add('is-active'));
      renderPage(id);
    }

    /* ═══ Helpers ═══ */
    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
    function escapeAttr(str) { return escapeHtml(str); }

    /* ═══ Toast system ═══ */
    function toast({ type='success', title, desc, timeout=3600 } = {}) {
      const host = document.getElementById('cmsToasts');
      const el = document.createElement('div');
      el.className = 'cms-toast cms-toast--' + type;
      const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>',
        error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        warn:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      el.innerHTML = `
        <span class="cms-toast-icon">${icons[type] || icons.success}</span>
        <div class="cms-toast-body">
          <div class="cms-toast-title">${title}</div>
          ${desc ? `<div class="cms-toast-desc">${desc}</div>` : ''}
        </div>
        <button class="cms-toast-close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      host.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      const kill = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); };
      el.querySelector('.cms-toast-close').addEventListener('click', kill);
      if (timeout) setTimeout(kill, timeout);
      return el;
    }

    /* ═══ Modal system ═══ */
    let modalOnConfirm = null;
    function openModal({ icon='danger', title, body, confirmLabel='Confirm', cancelLabel='Cancel', confirmVariant='danger', onConfirm=null }) {
      const modal = document.getElementById('cmsModal');
      const iconEl = document.getElementById('modalIcon');
      const iconMap = {
        danger:  { cls: 'is-danger',  svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' },
        warn:    { cls: 'is-warn',    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
        info:    { cls: 'is-info',    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' },
        success: { cls: 'is-success', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' }
      };
      const cfg = iconMap[icon] || iconMap.danger;
      iconEl.className = 'cms-modal-icon ' + cfg.cls;
      iconEl.innerHTML = cfg.svg;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      const confirmBtn = document.getElementById('modalConfirm');
      confirmBtn.textContent = confirmLabel;
      confirmBtn.className = 'cms-btn ' + (confirmVariant === 'primary' ? 'cms-btn--primary' : 'cms-btn--danger');
      document.getElementById('modalCancel').textContent = cancelLabel;
      modalOnConfirm = onConfirm;
      confirmBtn.onclick = () => { if (modalOnConfirm) modalOnConfirm(); };
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('cmsModal').classList.remove('show');
      document.body.style.overflow = '';
      modalOnConfirm = null;
    }
    // Backdrop click dismisses
    document.getElementById('cmsModal').addEventListener('click', (e) => {
      if (e.target.id === 'cmsModal') closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ═══ Form validation ═══ */
    function validatePage() {
      const missing = [];
      document.querySelectorAll('.editor-wrap input[data-required], .editor-wrap textarea[data-required]').forEach(el => {
        const wrap = el.closest('.field');
        if (!el.value.trim()) {
          wrap.classList.add('is-invalid');
          missing.push(wrap.querySelector('.field-label')?.textContent.replace('*', '').trim());
        } else {
          wrap.classList.remove('is-invalid');
        }
      });
      return missing;
    }

    /* ═══ Save & Publish flows ═══ */
    function onSaveDraft() {
      const btn = document.getElementById('btnSaveDraft');
      btn.classList.add('is-loading');
      setTimeout(() => {
        btn.classList.remove('is-loading');
        dirty = false;
        const banner = document.getElementById('bannerStatus');
        if (banner) banner.classList.remove('is-dirty');
        toast({ type: 'success', title: 'Draft saved',
                desc: `Your changes to ${PAGES[currentId].name} were saved as a draft. The live site is unchanged.` });
      }, 700);
    }
    function onPublishClick() {
      const missing = validatePage();
      if (missing.length) {
        // Scroll to first invalid field
        const first = document.querySelector('.field.is-invalid');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toast({ type: 'error', title: `${missing.length} required field${missing.length === 1 ? '' : 's'} missing`,
                desc: 'Fill in the highlighted fields before publishing.' });
        return;
      }
      openModal({
        icon: 'info',
        title: `Publish "${PAGES[currentId].name}"?`,
        body: `<p>Your changes will go live on <strong>powerhouselaw.com.au</strong> immediately.</p>
               <ul>
                 <li>Visitors will see the updated content on their next page load.</li>
                 <li>Search engines will re-index within 24 hours.</li>
                 <li>You can roll back to the previous version at any time.</li>
               </ul>`,
        confirmLabel: 'Publish now',
        confirmVariant: 'primary',
        onConfirm: () => {
          closeModal();
          const btn = document.getElementById('btnPublish');
          btn.classList.add('is-loading');
          setTimeout(() => {
            btn.classList.remove('is-loading');
            dirty = false;
            const banner = document.getElementById('bannerStatus');
            if (banner) { banner.classList.remove('is-dirty'); banner.textContent = 'Published'; }
            toast({ type: 'success', title: `${PAGES[currentId].name} published`,
                    desc: 'Live on powerhouselaw.com.au. Roll back available in Version History.' });
          }, 900);
        }
      });
    }
    /* ═══ Per-page Save Changes flow (the primary save action for editors) ═══ */
    function onSavePage() {
      const missing = validatePage();
      if (missing.length) {
        const first = document.querySelector('.field.is-invalid');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toast({ type: 'error', title: `${missing.length} required field${missing.length === 1 ? '' : 's'} missing`,
                desc: 'Fill in the highlighted fields before saving.' });
        return;
      }
      const btn = document.getElementById('pageSaveBtn');
      if (btn) btn.classList.add('is-loading');
      setTimeout(() => {
        if (btn) { btn.classList.remove('is-loading'); btn.classList.remove('cms-btn--attn'); }
        dirty = false;
        const saved = document.getElementById('cmsSaved');
        if (saved) { saved.classList.remove('is-dirty'); saved.textContent = 'Saved'; }
        const topSave = document.getElementById('btnSaveDraft');
        if (topSave) topSave.classList.remove('cms-btn--attn');
        toast({ type: 'success', title: `${PAGES[currentId].name} saved`,
                desc: 'Your changes to this page have been saved.' });
      }, 650);
    }

    function onDiscardChanges() {
      if (!dirty) {
        toast({ type: 'info', title: 'No unsaved changes',
                desc: `${PAGES[currentId].name} has no pending edits.` });
        return;
      }
      openModal({
        icon: 'warn',
        title: 'Discard changes?',
        body: `Your unsaved edits to <strong>${PAGES[currentId].name}</strong> will be lost. This cannot be undone.`,
        confirmLabel: 'Discard changes',
        confirmVariant: 'danger',
        onConfirm: () => {
          closeModal();
          dirty = false;
          const saved = document.getElementById('cmsSaved');
          if (saved) { saved.classList.remove('is-dirty'); saved.textContent = 'Saved'; }
          renderPage(currentId);
          toast({ type: 'info', title: 'Changes discarded',
                  desc: `${PAGES[currentId].name} reverted to the last saved version.` });
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      // Ctrl/Cmd+S now triggers the per-page Save Changes action
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); onSavePage(); }
    });
    // Warn before closing the tab with unsaved changes
    window.addEventListener('beforeunload', (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ═══ Item interactions (delete confirm / add / edit) ═══ */
    function onDeleteItem(btn, itemName) {
      openModal({
        icon: 'danger',
        title: 'Delete this item?',
        body: `<strong>${escapeHtml(itemName)}</strong> will be removed from this section. This cannot be undone once you publish.`,
        confirmLabel: 'Delete',
        onConfirm: () => {
          closeModal();
          const item = btn.closest('.repeater-item');
          item.style.transition = 'opacity .2s, transform .2s';
          item.style.opacity = '0';
          item.style.transform = 'translateX(-8px)';
          setTimeout(() => {
            item.remove();
            renumberRepeater(btn.closest('.repeater'));
            markDirty();
            toast({ type: 'success', title: 'Item deleted',
                    desc: `"${itemName}" removed from this section.` });
          }, 220);
        }
      });
    }
    // ═══ Per-item edit registry + modal ═══
    const REPEATER_REGISTRY = {};
    let __repIdCounter = 0;
    let itemEditContext = null; // { repId, idx }
    const DEFAULT_ITEM_SCHEMA = [
      { label: 'Title', key: 't', type: 'text', required: true },
      { label: 'Description', key: 'd', type: 'textarea', rows: 2 }
    ];

    function onEditItem(btn) {
      const row = btn.closest('.repeater-item');
      const rep = btn.closest('.repeater');
      if (!row || !rep) return;
      const idx = parseInt(row.dataset.idx, 10);
      const repId = rep.dataset.repId;
      const reg = REPEATER_REGISTRY[repId];
      if (!reg) return;
      const data = reg.items[idx] || {};
      const schema = reg.schema || DEFAULT_ITEM_SCHEMA;

      itemEditContext = { repId, idx };

      document.getElementById('sectionEditEyebrow').textContent = `${PAGES[currentId].name} · Editing ${reg.itemLabel.toLowerCase()}`;
      document.getElementById('sectionEditTitle').textContent = `${reg.itemLabel} · ${String(idx + 1).padStart(2, '0')}`;

      const fieldsHtml = schema.map(f => renderField({
        type: f.type || 'text',
        label: f.label,
        required: f.required,
        rows: f.rows,
        value: data[f.key] != null ? data[f.key] : '',
        help: f.help,
        badge: f.badge,
        placeholder: f.placeholder
      })).join('');

      document.getElementById('sectionEditBody').innerHTML = `<div class="card">
        <div class="card-title">
          <span class="card-title-icon">${svg('text', 12)}</span>
          <span class="card-title-text">${reg.itemLabel} details</span>
        </div>
        ${fieldsHtml}
      </div>`;

      const body = document.getElementById('sectionEditBody');
      body.dataset.dirty = '';
      body.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { body.dataset.dirty = '1'; });
        el.addEventListener('blur', () => {
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) wrap.classList.add('is-invalid');
          else if (wrap) wrap.classList.remove('is-invalid');
        });
      });
      document.getElementById('sectionEditModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    /* ═══════════════════════════════════════════════════════════════
       Filament-style Repeater — inline expanded cards
       Each item's fields are rendered directly inside its card (not via modal).
       ═══════════════════════════════════════════════════════════════ */
    function renderRepeaterBody(repId) {
      const reg = REPEATER_REGISTRY[repId];
      if (!reg) return '';
      if (!reg.items || !reg.items.length) {
        return `<div class="empty-state">
          <div class="empty-state-icon">${svg('list', 20)}</div>
          <div class="empty-state-title">No items yet</div>
          <div class="empty-state-desc">${reg.emptyHint}</div>
          <button class="repeater-add-btn" type="button" onclick="addRepeaterItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${reg.addLabel}</button>
        </div>`;
      }
      const cards = reg.items.map((it, i) => renderRepeaterCard(it, i, repId, reg.schema)).join('');
      return `${cards}<div class="repeater-add-wrap"><button class="repeater-add-btn" type="button" onclick="addRepeaterItem(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${reg.addLabel}</button></div>`;
    }

    function renderRepeaterCard(item, idx, repId, schema) {
      const fields = schema.map(sf => renderRepeaterField(sf, item[sf.key] != null ? item[sf.key] : '', repId, idx)).join('');
      return `<div class="repeater-item is-inline" data-idx="${idx}">
        <div class="repeater-item-head">
          <button type="button" class="repeater-item-reorder" title="Reorder" aria-label="Reorder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 7l3-3 3 3"/><path d="M17 20V4M14 17l3 3 3-3"/></svg>
          </button>
          <button type="button" class="repeater-item-remove" title="Remove" aria-label="Remove" onclick="onDeleteRepeaterItem(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
        <div class="repeater-item-fields">${fields}</div>
      </div>`;
    }

    function renderRepeaterField(sf, value, repId, idx) {
      const req = sf.required ? ' data-required="1"' : '';
      const dataAttrs = `data-rep-id="${repId}" data-idx="${idx}" data-key="${sf.key}"`;
      const spanFull = (sf.type === 'textarea' || sf.type === 'rich' || sf.fullWidth) ? ' is-full' : '';
      const labelHtml = sf.label
        ? `<label class="field-label">${sf.label}${sf.required ? '<span class="req">*</span>' : ''}${sf.badge ? ` <span class="badge">${sf.badge}</span>` : ''}</label>`
        : '';
      const helpHtml = sf.help ? `<div class="field-help">${sf.help}</div>` : '';
      const errHtml = sf.required ? `<div class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>This field is required</div>` : '';
      const placeholder = sf.placeholder ? ` placeholder="${escapeAttr(sf.placeholder)}"` : '';

      if (sf.type === 'textarea' || sf.type === 'rich') {
        const rows = sf.rows || 3;
        return `<div class="field${spanFull}">${labelHtml}<textarea class="field-textarea" rows="${rows}" ${dataAttrs}${placeholder}${req}>${escapeHtml(value)}</textarea>${errHtml}${helpHtml}</div>`;
      }
      if (sf.type === 'select' && sf.options) {
        const opts = sf.options.map(o => `<option value="${escapeAttr(o.value != null ? o.value : o)}"${(o.value != null ? o.value : o) === value ? ' selected' : ''}>${escapeHtml(o.label || o)}</option>`).join('');
        return `<div class="field${spanFull}">${labelHtml}<select class="field-select" ${dataAttrs}${req}><option value="">Select an option</option>${opts}</select>${errHtml}${helpHtml}</div>`;
      }
      if (sf.type === 'media') {
        // A real file is anything looking like a URL (blob/data/http/absolute/asset path) OR bare filename with an extension.
        const s = String(value || '');
        const looksLikeUrl = /^(blob:|data:|https?:|\/|assets\/)/.test(s);
        const looksLikeFile = looksLikeUrl || /\.[a-z0-9]{2,5}$/i.test(s);
        if (looksLikeFile) {
          const displayName = fileDisplayName(s);
          const metaText = fileDisplayMeta(s, sf.help || 'Uploaded file');
          const thumb = looksLikeUrl
            ? `<img src="${escapeAttr(s)}" alt="" onerror="this.style.display='none'" />`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
          return `<div class="field${spanFull}" ${dataAttrs}>${labelHtml}<div class="media-slot media-slot--compact">
            <div class="media-slot-thumb">${thumb}</div>
            <div class="media-slot-body">
              <div class="n">${escapeHtml(displayName)}</div>
              <div class="m">${escapeHtml(metaText)}</div>
            </div>
            <div class="media-slot-actions">
              <button type="button" class="cms-btn" onclick="onReplaceRepeaterMedia(this)">Replace</button>
              <button type="button" class="icon-ghost" title="Remove" onclick="onRemoveRepeaterMedia(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
            </div>
          </div>${errHtml}${helpHtml}</div>`;
        }
        return `<div class="field${spanFull}" data-rep-id="${dataAttrs.match(/data-rep-id="([^"]*)"/)?.[1] || ''}" data-idx="${dataAttrs.match(/data-idx="([^"]*)"/)?.[1] || ''}" data-key="${dataAttrs.match(/data-key="([^"]*)"/)?.[1] || ''}">${labelHtml}<div class="media-drop media-drop--compact" role="button" tabindex="0" onclick="onReplaceRepeaterMedia(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onReplaceRepeaterMedia(this);}">
          <div class="media-drop-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="media-drop-title">Drag &amp; drop or <a>Browse</a></div>
          ${sf.placeholder ? `<div class="media-drop-hint">${escapeHtml(sf.placeholder)}</div>` : ''}
        </div>${errHtml}${helpHtml}</div>`;
      }
      // default: text input
      return `<div class="field${spanFull}">${labelHtml}<input class="field-input" type="text" value="${escapeAttr(value)}" ${dataAttrs}${placeholder}${req} />${errHtml}${helpHtml}</div>`;
    }

    function rerenderRepeater(repEl) {
      const repId = repEl.dataset.repId;
      if (!repId) return;
      repEl.innerHTML = renderRepeaterBody(repId);
    }

    function addRepeaterItem(btn) {
      const rep = btn.closest('.repeater');
      if (!rep) return;
      const repId = rep.dataset.repId;
      const reg = REPEATER_REGISTRY[repId];
      if (!reg) return;
      const newItem = {};
      reg.schema.forEach(sf => { newItem[sf.key] = ''; });
      reg.items.push(newItem);
      rerenderRepeater(rep);
      markDirty();
      // Focus the first input of the new card so the user can start typing immediately
      const cards = rep.querySelectorAll('.repeater-item');
      const lastCard = cards[cards.length - 1];
      if (lastCard) {
        lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const firstInput = lastCard.querySelector('input, textarea, select');
        if (firstInput) setTimeout(() => firstInput.focus(), 250);
      }
    }

    function onDeleteRepeaterItem(btn) {
      const item = btn.closest('.repeater-item');
      const rep = btn.closest('.repeater');
      if (!item || !rep) return;
      const idx = parseInt(item.dataset.idx, 10);
      const repId = rep.dataset.repId;
      const reg = REPEATER_REGISTRY[repId];
      if (!reg || !reg.items[idx]) return;
      const primary = reg.items[idx][reg.schema[0].key] || `${reg.itemLabel} ${idx + 1}`;
      openModal({
        icon: 'danger',
        title: `Remove this ${reg.itemLabel.toLowerCase()}?`,
        body: `<strong>${escapeHtml(primary)}</strong> will be removed. This change is discarded if you cancel — or persists to the live site when you publish.`,
        confirmLabel: 'Remove',
        onConfirm: () => {
          closeModal();
          reg.items.splice(idx, 1);
          rerenderRepeater(rep);
          markDirty();
          toast({ type: 'success', title: `${reg.itemLabel} removed`,
                  desc: `"${primary}" was removed. Save the page to persist.` });
        }
      });
    }

    /* Global input delegation — write inline repeater edits back into REPEATER_REGISTRY */
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.matches || !el.matches('[data-rep-id][data-idx][data-key]')) return;
      const reg = REPEATER_REGISTRY[el.dataset.repId];
      const idx = parseInt(el.dataset.idx, 10);
      if (!reg || !reg.items[idx]) return;
      reg.items[idx][el.dataset.key] = el.value;
    });

    /* ═══ Media upload / remove / preview ═══ */
    /* ═══════════════════════════════════════════════════════════════
       Filament FileUpload — real browser file picker + drag & drop.
       - pickFile() opens the OS file dialog via a reusable hidden <input>
       - registerFile() stores {name, sizeKb} against the blob URL so
         re-rendered cards can still display the original filename.
       - Global dragover/drop delegation on the editor wires every
         .media-drop and .media-slot at once.
       ═══════════════════════════════════════════════════════════════ */
    const BLOB_NAMES = {};
    let __filePickerInput = null;
    function pickFile(accept, cb) {
      if (!__filePickerInput) {
        __filePickerInput = document.createElement('input');
        __filePickerInput.type = 'file';
        __filePickerInput.style.position = 'fixed';
        __filePickerInput.style.left = '-9999px';
        __filePickerInput.style.opacity = '0';
        document.body.appendChild(__filePickerInput);
      }
      __filePickerInput.value = '';
      __filePickerInput.accept = accept || 'image/*';
      __filePickerInput.onchange = () => {
        const file = __filePickerInput.files && __filePickerInput.files[0];
        if (file) cb(file);
      };
      __filePickerInput.click();
    }
    function registerFile(file) {
      const url = URL.createObjectURL(file);
      BLOB_NAMES[url] = { name: file.name, sizeKb: Math.round(file.size / 1024) };
      return url;
    }
    function fileDisplayName(value) {
      if (!value) return '';
      if (BLOB_NAMES[value]) return BLOB_NAMES[value].name;
      return String(value).split('/').pop() || String(value);
    }
    function fileDisplayMeta(value, fallback) {
      if (BLOB_NAMES[value]) return `${BLOB_NAMES[value].sizeKb} KB`;
      return fallback || '';
    }

    /* Route a picked File into the correct storage based on the target element */
    function attachFileToField(container, file) {
      const field = container.closest('.field');
      const url = registerFile(file);
      // Repeater-scoped field — update REPEATER_REGISTRY and re-render the repeater
      if (field && field.dataset.repId != null) {
        const repId = field.dataset.repId;
        const idx = parseInt(field.dataset.idx, 10);
        const key = field.dataset.key;
        const reg = REPEATER_REGISTRY[repId];
        if (reg && reg.items[idx]) {
          reg.items[idx][key] = url;
          rerenderRepeater(container.closest('.repeater'));
          markDirty();
          toast({ type: 'success', title: 'File uploaded',
                  desc: `"${file.name}" (${Math.round(file.size / 1024)} KB) attached to this ${reg.itemLabel.toLowerCase()}. Save the page to persist.` });
          return;
        }
      }
      // Top-level media field — swap the DOM in place (no repeater registry to touch)
      const parent = container.parentElement;
      if (!parent) return;
      const label = parent.querySelector(':scope > .field-label')?.outerHTML || '';
      parent.innerHTML = `${label}<div class="media-slot">
        <div class="media-slot-thumb"><img src="${url}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/><circle cx=&quot;8.5&quot; cy=&quot;8.5&quot; r=&quot;1.5&quot;/><path d=&quot;M21 15l-5-5L5 21&quot;/></svg>').firstChild)" /></div>
        <div class="media-slot-body">
          <div class="n">${escapeHtml(file.name)}</div>
          <div class="m">${Math.round(file.size / 1024)} KB · just uploaded</div>
        </div>
        <div class="media-slot-actions">
          <button type="button" class="cms-btn" onclick="onReplaceMedia(this)">Replace</button>
          <button type="button" class="icon-ghost" title="Remove" onclick="onRemoveMedia(this, '${escapeAttr(file.name)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
      </div>`;
      markDirty();
      toast({ type: 'success', title: 'Image uploaded',
              desc: `"${file.name}" (${Math.round(file.size / 1024)} KB) uploaded. Save the page to persist.` });
    }

    function onReplaceMedia(elOrBtn) {
      const container = elOrBtn.closest('.media-slot, .media-drop');
      if (!container) return;
      pickFile('image/*,.svg', (file) => attachFileToField(container, file));
    }
    function onRemoveMedia(btn, name) {
      openModal({
        icon: 'danger',
        title: 'Remove this image?',
        body: `<strong>${escapeHtml(name)}</strong> will be removed from this field.`,
        confirmLabel: 'Remove',
        onConfirm: () => {
          closeModal();
          const slot = btn.closest('.media-slot');
          slot.style.transition = 'opacity .2s';
          slot.style.opacity = '0.35';
          markDirty();
          toast({ type: 'success', title: 'Image removed', desc: `"${name}" was removed from this field.` });
          setTimeout(() => { slot.style.opacity = '1'; }, 400);
        }
      });
    }

    /* Repeater-scoped media handlers — proxy through pickFile → attachFileToField */
    function onReplaceRepeaterMedia(btn) {
      const container = btn.closest('.media-slot, .media-drop');
      if (!container) return;
      pickFile('image/*,.svg', (file) => attachFileToField(container, file));
    }
    function onRemoveRepeaterMedia(btn) {
      const field = btn.closest('.field');
      const repId = field?.dataset.repId;
      const idx = parseInt(field?.dataset.idx, 10);
      const key = field?.dataset.key;
      const reg = REPEATER_REGISTRY[repId];
      if (!reg || Number.isNaN(idx) || !reg.items[idx]) return;
      const value = reg.items[idx][key];
      const displayName = fileDisplayName(value) || 'this file';
      openModal({
        icon: 'danger',
        title: 'Remove this file?',
        body: `<strong>${escapeHtml(displayName)}</strong> will be removed from this field.`,
        confirmLabel: 'Remove',
        onConfirm: () => {
          closeModal();
          reg.items[idx][key] = '';
          const rep = btn.closest('.repeater');
          rerenderRepeater(rep);
          markDirty();
          toast({ type: 'success', title: 'File removed',
                  desc: `The file was cleared from this ${reg.itemLabel.toLowerCase()}.` });
        }
      });
    }

    /* Global drag & drop — delegated on the editor so it works for every media-drop / media-slot including ones rendered dynamically */
    (function wireDragDrop() {
      const editor = document.getElementById('editor');
      if (!editor || editor.dataset.dragWired === '1') return;
      editor.dataset.dragWired = '1';
      editor.addEventListener('dragover', (e) => {
        const drop = e.target.closest('.media-drop, .media-slot');
        if (!drop) return;
        e.preventDefault();
        drop.classList.add('is-dragover');
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });
      editor.addEventListener('dragleave', (e) => {
        const drop = e.target.closest('.media-drop, .media-slot');
        if (drop && !drop.contains(e.relatedTarget)) drop.classList.remove('is-dragover');
      });
      editor.addEventListener('drop', (e) => {
        const drop = e.target.closest('.media-drop, .media-slot');
        if (!drop) return;
        e.preventDefault();
        drop.classList.remove('is-dragover');
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) attachFileToField(drop, file);
      });
    })();

    function onPreviewSection(sectionId) {
      const url = PAGES[currentId].url;
      if (url) window.open(url + '#' + sectionId, '_blank');
      else toast({ type: 'info', title: 'Preview unavailable', desc: 'This page has no live URL to preview.' });
    }

    /* ═══ Section Edit Modal ═══
       Opens when the "Edit" button in a section header is clicked. Renders every card + field
       for that section inside a scrollable modal, pre-populated with existing content. */
    let currentEditSectionId = null;
    function openSectionEdit(sectionId) {
      const p = PAGES[currentId];
      const s = p.sections.find(x => x.id === sectionId);
      if (!s) return;
      currentEditSectionId = sectionId;
      document.getElementById('sectionEditEyebrow').textContent = `${p.name} · Editing section`;
      document.getElementById('sectionEditTitle').textContent = s.title;
      // Reuse the same card renderer so the modal shows every editable field
      document.getElementById('sectionEditBody').innerHTML = s.cards.map(renderCard).join('');
      // Wire dirty tracking on modal inputs
      const body = document.getElementById('sectionEditBody');
      body.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { body.dataset.dirty = '1'; });
        el.addEventListener('blur', () => {
          const wrap = el.closest('.field');
          if (wrap && el.dataset.required && !el.value.trim()) wrap.classList.add('is-invalid');
          else if (wrap) wrap.classList.remove('is-invalid');
        });
      });
      document.getElementById('sectionEditModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeSectionEdit() {
      const body = document.getElementById('sectionEditBody');
      if (body.dataset.dirty === '1') {
        openModal({
          icon: 'warn',
          title: 'Discard changes?',
          body: 'You have unsaved edits in this section. Closing now will lose them.',
          confirmLabel: 'Discard',
          onConfirm: () => {
            closeModal();
            body.dataset.dirty = '';
            document.getElementById('sectionEditModal').classList.remove('show');
            document.body.style.overflow = '';
          }
        });
        return;
      }
      document.getElementById('sectionEditModal').classList.remove('show');
      document.body.style.overflow = '';
      currentEditSectionId = null;
      itemEditContext = null;
    }
    function saveSectionEdit() {
      // Validate required fields in the modal
      const modalBody = document.getElementById('sectionEditBody');
      const missing = [];
      modalBody.querySelectorAll('input[data-required], textarea[data-required]').forEach(el => {
        const wrap = el.closest('.field');
        if (!el.value.trim()) {
          wrap.classList.add('is-invalid');
          missing.push(wrap.querySelector('.field-label')?.textContent.replace('*', '').trim());
        } else {
          wrap.classList.remove('is-invalid');
        }
      });
      if (missing.length) {
        toast({ type: 'error', title: `${missing.length} required field${missing.length === 1 ? '' : 's'} missing`,
                desc: 'Fill in the highlighted fields before saving.' });
        return;
      }
      const saveBtn = document.getElementById('sectionEditSave');
      saveBtn.textContent = '';
      saveBtn.classList.add('is-loading');
      setTimeout(() => {
        saveBtn.classList.remove('is-loading');
        saveBtn.textContent = 'Save changes';

        if (itemEditContext) {
          const reg = REPEATER_REGISTRY[itemEditContext.repId];
          const workingIdx = itemEditContext.idx != null ? itemEditContext.idx : 0;
          const fields = modalBody.querySelectorAll('.field');

          // Read every field value back out of the DOM. For media fields the current value
          // already lives on the registry (attachFileToField wrote it), so we skip empty inputs.
          reg.schema.forEach((f, i) => {
            const fieldEl = fields[i];
            if (!fieldEl) return;
            const el = fieldEl.querySelector('input:not([type="checkbox"]), textarea, select');
            if (el) reg.items[workingIdx][f.key] = el.value;
          });
          const savedRow = reg.items[workingIdx];

          // Table-page edit: commit into PAGES[pageId].table.rows and re-render the page
          if (itemEditContext.tableEdit) {
            const ctx = itemEditContext.tableEdit;
            const targetPage = PAGES[ctx.pageId];
            if (targetPage && targetPage.table) {
              if (ctx.isNew) {
                targetPage.table.rows.push(savedRow);
              } else {
                targetPage.table.rows[ctx.rowIdx] = savedRow;
              }
              renderPage(ctx.pageId);
            }
            document.getElementById('sectionEditModal').classList.remove('show');
            document.body.style.overflow = '';
            markDirty();
            const noun = reg.itemLabel || 'Record';
            toast({ type: 'success', title: `${noun} ${ctx.isNew ? 'created' : 'updated'}`,
                    desc: `"${escapeHtml(savedRow[reg.schema[0].key] || '')}" ${ctx.isNew ? 'added to the list' : 'was saved'}.` });
            itemEditContext = null;
            return;
          }

          // Inline-repeater edit (legacy): update the visible row in place
          const rep = document.querySelector(`.repeater[data-rep-id="${itemEditContext.repId}"]`);
          if (rep) {
            const row = rep.querySelector(`.repeater-item[data-idx="${workingIdx}"]`);
            if (row) {
              const primary = savedRow[reg.schema[0].key] || '';
              const secondary = reg.schema[1] ? (savedRow[reg.schema[1].key] || '') : '';
              const tEl = row.querySelector('.repeater-item-body .t');
              if (tEl) tEl.textContent = primary;
              let dEl = row.querySelector('.repeater-item-body .d');
              if (secondary) {
                if (!dEl) {
                  dEl = document.createElement('div');
                  dEl.className = 'd';
                  row.querySelector('.repeater-item-body').appendChild(dEl);
                }
                dEl.textContent = secondary;
              } else if (dEl) {
                dEl.remove();
              }
            }
          }
          modalBody.dataset.dirty = '';
          document.getElementById('sectionEditModal').classList.remove('show');
          document.body.style.overflow = '';
          markDirty();
          const label = reg.itemLabel || 'Item';
          toast({ type: 'success', title: `${label} updated`,
                  desc: `Changes to "${savedRow[reg.schema[0].key] || ''}" saved. Publish to make them live.` });
          itemEditContext = null;
          return;
        }

        modalBody.dataset.dirty = '';
        document.getElementById('sectionEditModal').classList.remove('show');
        document.body.style.overflow = '';
        markDirty();
        toast({ type: 'success', title: 'Section updated',
                desc: `Your changes to "${PAGES[currentId].sections.find(s => s.id === currentEditSectionId).title}" have been saved. Publish to make them live.` });
        currentEditSectionId = null;
      }, 700);
    }
    // Backdrop click on the section edit modal
    document.getElementById('sectionEditModal').addEventListener('click', (e) => {
      if (e.target.id === 'sectionEditModal') closeSectionEdit();
    });

    /* ═══ Boot ═══ */
    renderSidebar();
    switchPage('home');
  </script>
</body>
</html>
